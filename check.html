<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' 'unsafe-eval'; base-uri 'none'; form-action 'none'">
<title>AI_GO&nbsp;: vérifier un fichier</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; padding: 2rem 1.25rem 5rem;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1b2126; background: #fff; line-height: 1.6;
  }
  .wrap { max-width: 50rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  h2 { font-size: 1.05rem; margin: 2rem 0 .5rem; }
  .lead { color: #5a666f; margin: 0 0 1.5rem; }
  .drop {
    border: 2px dashed #9aa7af; border-radius: 6px;
    padding: 2rem 1.5rem; text-align: center; color: #5a666f;
    background: #f4f6f7; cursor: pointer;
  }
  .drop.over { border-color: #2b5f70; background: #e6eff1; color: #1b2126; }
  .drop input { display: block; margin: .75rem auto 0; }
  textarea { width: 100%; min-height: 6rem; margin-top: .75rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8125rem; }
  button { font: inherit; padding: .5rem 1rem; border: 1px solid #9aa7af; border-radius: 4px; background: #fff; cursor: pointer; }
  .verdict {
    display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap;
    padding: 1rem 1.25rem; border-radius: 4px; border-left: 4px solid;
    margin: 1.5rem 0 1rem; font-weight: 600;
  }
  .v-ok   { background: #e6f0e9; border-color: #2f6b45; color: #1e4a2e; }
  .v-warn { background: #f7efdd; border-color: #8a6410; color: #5c440b; }
  .v-bad  { background: #f7e8e5; border-color: #96382a; color: #6b281e; }
  .verdict small { font-weight: 400; }
  table { border-collapse: collapse; width: 100%; font-size: .875rem; }
  th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid #e4e9eb; vertical-align: top; }
  th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: #5a666f; background: #f4f6f7; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
  code { background: #f4f6f7; padding: .1em .3em; border-radius: 2px; }
  pre { background: #f7e8e5; padding: 1rem; border-radius: 4px; overflow-x: auto; font-size: .8125rem; }
  .lvl { font-weight: 600; white-space: nowrap; }
  .lvl-error { color: #96382a; }
  .lvl-warn { color: #8a6410; }
  .paths { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8125rem; list-style: none; padding: 0; }
  .paths li { padding: .2rem 0; border-bottom: 1px solid #f0f3f4; }
  .muted { color: #5a666f; font-size: .875rem; }
  footer { margin-top: 3rem; }
  .lang { display: flex; align-items: baseline; gap: .5rem; margin: 0 0 1rem; }
  .lang button { padding: .25rem .6rem; font-size: .875rem; }
  .lang button[aria-pressed="true"] { background: #2b5f70; border-color: #2b5f70; color: #fff; }
</style>
</head>
<body>
<div class="wrap">

  <p class="lang"><span id="t-langLabel"></span>
    <button type="button" id="lang-fr" lang="fr" aria-pressed="true">Français</button>
    <button type="button" id="lang-en" lang="en" aria-pressed="false">English</button></p>

  <h1 id="t-title"></h1>
  <p class="lead" id="t-lead"></p>

  <div class="drop" id="drop">
    <span id="t-drop"></span>
    <input type="file" id="file" accept=".html,.htm,.js,.txt">
  </div>
  <p class="muted"><label for="host" id="t-hostLabel"></label>
    <input type="text" id="host" size="26" autocomplete="off" spellcheck="false"></p>
  <p class="muted" id="t-exec"></p>

  <details>
    <summary id="t-pasteHead"></summary>
    <textarea id="paste" spellcheck="false"></textarea>
    <button type="button" id="pasteGo"></button>
  </details>

  <div id="out"></div>

  <footer class="muted" id="t-foot"></footer>
</div>

<script>
/* =============================================================================
 * check.html: the validator. It never ships to a visitor.
 *
 * IT DOES NOT CARRY A SECOND COPY OF THE PUBLICATION GUARD. It extracts the
 * engine block from the file you drop and runs THAT engine's structure() and
 * guard(): the publication verdict you read here is the one your own page will
 * render, not an approximation of it. The origin policy therefore exists once
 * in this repository, in the engine block of ai-go.html.
 *
 * IT DOES NOT JUDGE THE BLOCK EITHER. It judges the FILE. The scripts of the
 * dropped file are run, in order, in a sandbox holding a global object of its
 * own, and the questionnaire is then read off that global object under the name
 * the data-ai-go attribute gives, which is, character for character, what the
 * engine does with window[name] once the page has finished loading. Judging the
 * text between the two content markers instead let four different files be
 * certified while a fifth was served: a later script rewriting a branch, a
 * `let` hidden behind a continuation comma, a `var` quoted in a comment, and a
 * second content block. The language now answers the question "is this on
 * window", because the language is the only thing that knows.
 *
 * What this page adds, and what deliberately never runs in a visitor's
 * browser: path enumeration, unreachable nodes, cycles, dead ends, polarity
 * declarations, review age, source-text hygiene, and a routing diff between
 * two versions of a file.
 *
 * The pure half of this page (marker parsing, block extraction, path
 * enumeration, the extra coherence checks, the source-text lint) is returned
 * as AI_GO_CHECK and is what the harness exercises: there is one enumerator in
 * this repository, not one here and one in the tests.
 * ========================================================================== */
var AI_GO_CHECK = (function () {
  'use strict';

  /* Written by code point, never typed: this page is scanned by its own lint. */
  var NBSP = String.fromCharCode(160);
  /* The OTHER one. U+202F is what a French word processor puts before a colon,
   * a semicolon and a question mark, so it arrives in a content block by paste
   * far more often than U+00A0 does, and it is just as invisible in an editor
   * and just as lost on the next copy. The lint knew one of the two. */
  var NNBSP = String.fromCharCode(0x202f);
  var NBSPS = [{ ch: NBSP, code: 'U+00A0' }, { ch: NNBSP, code: 'U+202F' }];

  /* THE BASE TABLE. English, the way the engine keeps English as its base.
   * Nothing here is read by a reader until setLang has filled S below. */
  var EN = {
    title: 'Check a file',
    lead: 'Drop your ai-go.html file below. Nothing is sent anywhere: everything happens in your browser.',
    drop: 'Drag a file here, or choose one:',
    hostLabel: 'Domain where you will publish it (optional):',
    pageLang: 'The page declares lang="{page}" but the questionnaire is written in "{tree}". A screen reader would read it with the wrong voice.',
    verdictFor: 'Publication verdict computed for {host}.',
    verdictForNone: 'Publication verdict for an unnamed domain: the only check left out is the one that compares your domain with the domains the content declares. Everything else below is reported exactly as it would be with a domain typed. Type your domain above to check that one too.',
    exec: 'The scripts of the file you drop are run here, in order, in a sandbox of their own: this page reads the questionnaire off that sandbox the way the engine reads it off window. Nothing is sent anywhere and nothing survives the check. Only drop your own files.',
    pasteHead: 'Or paste a block (from the begin marker to the end marker)',
    pasteGo: 'Check this block',
    foot: 'This page depends on no neighbouring file. It reads the engine out of the file you give it.',

    syntax: 'The file could not be read',
    syntaxHint: 'Syntax error. Most frequent causes: a missing or extra comma, or a straight apostrophe inside a single-quoted string. Open the file in an editor that underlines syntax errors.',
    noContent: 'No content found in this file',
    notMountable: 'This file would not mount its questionnaire',
    noContentHint: 'The file must declare an object variable, for example: var AI_GO_CONTENT = { ... };',
    /* Everything this page refuses to guess about WHICH object it is judging.
     * Each names the object the page would have mounted, and the one edit that
     * settles it. The example container is described rather than spelled out: a
     * container written here would be found by this page's own reader, if this
     * page were ever dropped on itself. */
    noContainerHint: 'No container in this file. The engine mounts the variable named by the data-ai-go attribute of a container element, and there is none here. If you pasted a block, paste it from the AI_GO-BEGIN line to the AI_GO-END line, container included.',
    twoContainersHint: 'This file carries containers naming two different variables ({names}), so there is no single questionnaire to judge. Check one file, with one container, at a time.',
    badNameHint: 'The container names "{name}", which is not a variable name. Correct the data-ai-go attribute.',
    notDeclaredHint: 'The container names "{name}". Every script of this file was run, in order, and window["{name}"] is still undefined, which is where the engine looks. Either the attribute or the variable was renamed and the other was not.',
    /* No longer read off the source: the file was RUN, the name was visible to
     * the code and absent from the global object, and only a lexical
     * declaration does that. The sentence therefore names the three keywords
     * that produce it instead of quoting one the source may not even carry. */
    notGlobalHint: 'The container names "{name}", and this file does declare it, but not on window: a top-level let, const or class is not a property of window, and the engine reads window["{name}"]. On your site the page would show "did not load". Write var {name} = ... or window.{name} = ... instead.',
    notObjectHint: 'The container names "{name}", and once the file has run it is not an object. The file must declare the questionnaire itself.',
    notRunHint: 'This file also carries {n} script(s) this page did not run (a script loaded from a separate file, or a module): if the questionnaire is declared in one of them, this page cannot see it and neither can this verdict.',
    scriptThrew: 'A script of this file threw while it ran: {msg}. The browser drops that script and runs the others, so the page still mounts, but that script did none of what it was meant to do.',
    engineBroken: 'The engine block of this file does not run',
    crashed: 'The check failed: ',

    bad: 'Blocking errors: {n}',
    notPublishable: 'Coherent, but NOT publishable: {n} point(s) to complete',
    uiMissing: 'Language "{lang}" has no interface labels for: {keys}. Those are served in English.',
    chromeTerm: 'The page around the questionnaire still names {origin} ({term}). The engine cannot see the title, the heading or the standfirst, so it will publish them as they are.',
    chromeSentinel: 'The page around the questionnaire still carries the placeholder "{sentinel}", outside the tree: in the title, the heading, the standfirst, or the message shown when scripts do not run. The engine only reads the tree, so it will publish this as it stands.',
    okWarn: 'Publishable, {n} warning(s)',
    ok: 'Publishable',
    counts: '{nodes} question(s), {results} result(s), {paths} path(s)',

    fileH: 'The file',
    markersOk: 'The six markers are present, once each, in order.',
    markersBad: 'Markers missing, duplicated or out of order: {list}. An editor or a CMS has probably rewritten them.',

     * that is blocking. OUT OF ORDER makes the extraction meaningless, also
     * blocking. MISSING is what a partial paste looks like, so it is reported
     * and not made blocking: the verdict already says the engine is absent. */

    markersMissing: 'Marker missing: {list}. If you dropped a whole file, an editor has eaten it. If you pasted a fragment, paste from the AI_GO-BEGIN line to the AI_GO-END line.',
    engineIntact: 'Engine {v}, intact.',

    engineNone: 'No engine block in this file: the publication verdict cannot be computed, only coherence. Drop your complete ai-go.html file.',

    publication: 'Publication',
    /* The old sentence said the declaration check was skipped and everything

     * reserved-term lock on the page around the questionnaire was demoted to a
     * warning, and warnings were counted and never drawn, so the DEFAULT state
     * of this page (nobody has typed anything yet) printed the greenest
     * sentence it owns over a copy wearing the origin's name in its headline.
     * The demotion is gone; so is the claim, which now names what it skips. */
    publicationLead: 'What the engine of THIS file requires before displaying the content on your site. No domain given, so the one check left out is the comparison between your domain and the domains the content declares. Everything else is reported here as it would be on your site.',
    publicationLeadHost: 'What the engine of THIS file requires before displaying the content on {host}, the domain you typed. Change it above and this verdict is recomputed.',
    publicationOk: 'Nothing to complete: the engine will display this content.',
    /* The sentence above is about the ENGINE, and it stays true when this page
     * refuses the file for something the engine cannot see: the title, the
     * heading and the standfirst are outside the tree, so guard() never reads
     * them. True and, read alone under a red banner, reassuring in exactly the
     * wrong direction. So when the two disagree, the section says which. */
    publicationOkBlocked: 'Nothing to complete for the engine: it would display this content. But the engine cannot see the page around the questionnaire, and this page found {n} blocking point(s) there. Read the table below before you publish.',

    coherence: 'Coherence',
    coherenceLead: 'The permanent check, to run on every content change. Lines marked with a cross make the engine refuse to display; the others are warnings only this page sees.',
    coherenceOk: 'Nothing to report.',

    source: 'Source-text hygiene',
    pathsH: 'Possible paths',
    pathsLead: 'Rule equivalence classes: a checkbox question yields two branches ("at least one" / "none"), because that is what the routing distinguishes. This is the list you read aloud with your legal service, and the list you have signed.',
    truncated: 'Enumeration INCOMPLETE (tree too large or too deep): this list is not reliable.',

    updateH: 'Update',
    updateLead: 'Drop the old file first, then the new one: this section compares the two.',
    updateNone: 'Drop a second file to compare.',
    routingSame: 'The routing has not moved: {n} identical paths.',
    routingMoved: 'The routing has moved: {a} path(s) added, {r} removed. A new legal review is due.',
    printsSame: 'Fingerprint unchanged: {h}. Neither the start, nor a question, nor a result, nor a link has moved.',
    printsMoved: 'Fingerprint changed: {ho} to {hn}.',
    signs: 'signature {hash}',
    signsLead: 'The signature is the other half of the receipt: it covers what the fingerprint does not draw on, and what a reader sees all the same -- the publisher, the review, the disclaimer, the attribution, the law named, the step names under the progress bar and the interface labels. A copy that renamed its steps and turned its Continue button into "Publish unchecked" handed back a fingerprint identical to the original, character for character. Compare both, or you have compared half the page.',
    signsSame: 'Signature unchanged: {h}. Neither the signatories nor the wording around the questions has moved.',
    signsMoved: 'Signature changed: {ho} to {hn}. The questions may be untouched; who answers for them, or the wording around them, is not.',

    where: 'Where', msg: 'Message', level: 'Level',
    reviewed: 'Reviewed on {date} by {by}', noReview: 'No review date',
    jurisdiction: 'Jurisdiction: {j}', legalBasis: 'Legal basis: {b}',

    line: 'line {n}',
    literalNbsp: 'Literal non-breaking space ({code}). Write it as the six characters of the escape instead.',
    chromeNbsp: 'Literal non-breaking space ({code}) outside the content block, where neither the typography tool nor the escape rule reaches. In markup, write it as the six characters of the HTML entity instead.',
    quoteApostrophe: 'Apostrophe inside a single-quoted string. Use double quotes.',
    markupInText: 'A text contains a sequence that would close the script block and kill the page: {seq}.',
    angleInText: 'A text contains an angle bracket. Avoid them: nothing is ever interpreted as markup, but an open tag breaks the file.',
    unreachableNode: 'Question unreachable from the start node.',
    unreachableResult: 'Unreachable result.',
    dangling: 'Path with no outcome: {path}',
    cycle: 'Cycle detected on "{id}".',
    badPolarity: 'Expected value for `polarity`: "direct" or "inverse".',
    noPolarity: 'Checkbox question with no declared `polarity`. Declare it, so the intent survives review.',
    untranslated: 'Untranslated text (a bare string where the tree declares {langs}). It will display as is in every language.',
    defaultLangNotDeclared: 'The default language "{lang}" is not in `langs`.',
    oldReview: 'The review is {days} days old.',
    badReviewDate: 'Unreadable review date.',

    /* The chrome this page writes itself, and the four `where` labels the
     * rows below used to carry as literals in the middle of the code. */
    pageTitle: 'AI_GO: check a file',
    langLabel: 'Language of this page:',
    whereMarkers: 'markers',
    whereEngine: 'engine block',
    whereScript: 'a script of this file',
    whereChrome: 'the page around the questionnaire'
  };

  /* THE SAME TABLE IN FRENCH. Key by key, over the base above, the way the
   * engine ships a `fr` label set over its English one. A key left out here
   * falls back to the English sentence rather than blanking the page. */
  var FR = {

    verdictForNone: 'Verdict de publication pour un domaine non nommé\u00a0: la seule vérification laissée de côté est celle qui compare votre domaine aux domaines que le contenu déclare. Tout le reste ci-dessous est rapporté exactement comme il le serait avec un domaine saisi. Saisissez le vôtre ci-dessus pour vérifier celui-là aussi.',
    exec: 'Les scripts du fichier que vous déposez sont exécutés ici, dans l’ordre, dans un bac à sable qui leur est propre\u00a0: cette page y lit le questionnaire comme le moteur le lit sur window. Rien n’est envoyé nulle part et rien ne survit à la vérification. Ne déposez que vos propres fichiers.',
    pasteHead: 'Ou collez un bloc (du marqueur de début au marqueur de fin)',
    pasteGo: 'Vérifier ce bloc',

    syntax: 'Le fichier n’a pas pu être lu',

    noContent: 'Aucun contenu trouvé dans ce fichier',
    notMountable: 'Ce fichier ne monterait pas son questionnaire',
    noContentHint: 'Le fichier doit déclarer une variable objet, par exemple\u00a0: var AI_GO_CONTENT = { ... };',
    noContainerHint: 'Aucun conteneur dans ce fichier. Le moteur monte la variable que nomme l’attribut data-ai-go d’un élément conteneur, et il n’y en a aucun ici. Si vous avez collé un bloc, collez-le de la ligne AI_GO-BEGIN à la ligne AI_GO-END, conteneur compris.',

    badNameHint: 'Le conteneur nomme «\u00a0{name}\u00a0», qui n’est pas un nom de variable. Corrigez l’attribut data-ai-go.',

    notGlobalHint: 'Le conteneur nomme «\u00a0{name}\u00a0», et ce fichier le déclare bien, mais pas sur window\u00a0: un let, un const ou une class de premier niveau n’est pas une propriété de window, et le moteur lit window["{name}"]. Sur votre site, la page afficherait «\u00a0ne s’est pas chargé\u00a0». Écrivez plutôt var {name} = ... ou window.{name} = ...',

    okWarn: 'Publiable, {n} avertissement(s)',
    ok: 'Publiable',
    counts: '{nodes} question(s), {results} résultat(s), {paths} chemin(s)',

    fileH: 'Le fichier',

    engineIntact: 'Moteur {v}, intact.',
    engineChanged: 'Moteur {v}, MODIFIÉ LOCALEMENT (déclaré {d}, calculé {c}). Une mise à jour écrasera cette modification.',

     * A container left on the language it shipped with, over questions written
     * in another, mounts in a language none of the texts exist in. */

  /* The title, the page heading and the standfirst live OUTSIDE the tree, so
   * guard() never reads them, and they are the largest words on the page. A copy
   * that rewrote its questions and kept the origin's headline goes live wearing
   * that headline. This page reads the whole file, so it is the only one that
   * can say so. Pure, and separate from analyse(), so the harness can sweep it
   * on one line of markup instead of re-reading a whole file per variant. */
  var ACCENT = { grave: '\u0300', acute: '\u0301', circ: '\u0302', tilde: '\u0303',
                 uml: '\u0308', ring: '\u030a', cedil: '\u0327' };

   * paint a space, an invisible, an ampersand or the underscore of AI_GO. The
   * accented letters are handled by rule above, and every numeric form below. */
  var NAMED = { amp: '&', nbsp: ' ', ensp: ' ', emsp: ' ', emsp13: ' ', emsp14: ' ', numsp: ' ',
    puncsp: ' ', thinsp: ' ', hairsp: ' ', lowbar: '_', UnderBar: '_', shy: '\u00ad',
    zwnj: '\u200c', zwj: '\u200d', lrm: '\u200e', rlm: '\u200f', ZeroWidthSpace: '\u200b',
    NoBreak: '\u2060', ApplyFunction: '\u2061', InvisibleTimes: '\u2062', InvisibleComma: '\u2063' };

   * else, so everything outside it is this function's business. The premise
   * written here before was that "outside" meant "above": it read text.slice(0,
   * position of AI_GO-CONTENT-BEGIN), which in the file this repository ships
   * is the <title> and not one character more. The <h1> and the standfirst, the
   * two largest lines on the page, and the ones the README tells an adopter to
   * write themselves, sit twenty lines BELOW AI_GO-CONTENT-END and were never
   * looked at. Both sides are read now, line by line, so the finding says which
   * line to open. Reported wherever the page is served: unlike a reserved term,
   * this one has nothing to do with the domain. */
  function chromeSpaces(text) {
    var issues = [], r = contentRange(text), lines = String(text).split('\n');
    /* Line numbers first, then the block cut out of them, so a finding below the
     * block still names its true line in the file. */

      return r !== null && from < r.end && to > r.start;
    };

    lines.forEach(function (line, i) {
      var from = at, to = at + line.length;
      at = to + 1;
      if (inBlock(from, to)) return;
      var found = NBSPS.filter(function (s) { return line.indexOf(s.ch) >= 0; });
      if (!found.length) return;
      issues.push({ level: 'warn', where: fmt(S.line, { n: i + 1 }),

  function under(host, home) {
    return !!home && !!host && (host === home || host.slice(-(home.length + 1)) === '.' + home);
  }
  /* THE DOMAIN FIELD IS OPTIONAL AND EMPTY BY DEFAULT, which is the state this
   * page is in when a legal officer opens it for the first and only time. In
   * that state this finding used to be demoted to a warning, and warnings were
   * counted in the banner and drawn nowhere, so a file whose standfirst read
   * "adapted from the AI_GO questionnaire of the University of Lausanne" was
   * answered with "Nothing to complete: the engine will display this content."
   * The same file, one domain typed, was two blocking errors. That was the most
   * dangerous green light in this repository, and it was the default.
   *
   * There is no need to demote anything, because the missing domain is not what
   * this check needs. With no domain we cannot ask the PAGE where it is served,
   * so we ask the FILE whose it is: a content block whose declared publisher
   * domains all sit under the origin's domain is the origin's own file, and its
   * headline may name the origin. Anything else is a copy, and a copy wearing
   * the origin's name in its largest words is wrong on every domain, not only
   * on the one nobody typed. The tree is optional so that the older three-
   * argument call still means what it always meant. */
  /* CE QUE LA PAGE MONTRE, hors scripts, styles et commentaires, avec les
   * references de caracteres resolues comme un navigateur les resout. Sorti de
   * chromeTerms sans qu'une ligne change, parce que deux controles s'en servent
   * desormais : les noms reserves, qui ne valent que hors du domaine d'origine,
   * et les textes a remplacer, qui valent partout.
   *
   * `text` est le fichier entier ; ce qui sort est ce qu'un lecteur lit. */
  function chromeText(text) {
    var chrome;
    /* What the page SHOWS: the title and the body markup, with every script,
     * style and comment removed. The markers carry the tool's own name, and they
     * are structure, not chrome. Tags assembled, since this file may not contain
     * one inside a script body. */
    /* LA FERMETURE S'ECRIT DE PLUSIEURS FACONS, et un navigateur les ferme
     * toutes : une espace avant le chevron, une barre oblique, un saut de ligne.
     * Exiger la forme courte faisait echouer le retrait, si bien que le code du
     * moteur devenait du « texte visible » et tombait sous les controles ecrits
     * pour ce qu'un lecteur lit. */

      return t.replace(new RegExp('<' + tag + '[\\s\\S]*?<\\/' + tag + '[^>]*>', 'gi'), ' ');

      /* UN COMMENTAIRE NE SEPARE RIEN A L'ECRAN. Il etait remplace par une
       * espace, si bien qu'un marqueur coupe en deux par un commentaire, que
       * Chrome dessine TO_FILL_IN d'un seul tenant, n'en etait plus un ici. Un navigateur le
       * retire sans rien mettre a la place ; on fait pareil. */
      .replace(new RegExp('<' + '!--[\\s\\S]*?--' + '>', 'g'), '');
    /* A browser paints &eacute; as an e with an accent, and &#x200b; as nothing
     * at all. Reading the source undecoded let the origin's name sit in a title
     * untouched. The semicolon is optional because a browser makes it optional.
     * Numeric: every code point, astral included, which fromCharCode truncated. */
    chrome = chrome
      .replace(/&#(\d+);?/g, function (m, d) { return +d <= 0x10ffff ? fromCode(+d) : m; })

      .replace(/&([A-Za-z])(grave|acute|circ|tilde|uml|ring|cedil);?/g,
        function (m, l, a) { return l + ACCENT[a]; })
      /* ET LES TROIS ALPHABETS STYLISES, par regle eux aussi. &Uopf; &Ufr; et
       * &Uscr; nomment un U ajoure, gothique ou anglaise ; aucun n'etait dans la
       * table, et &Uopf;&Nopf;&Iopf;&Lopf; peignait le nom d'origine sous un
       * verdict « publiable ». On rend la LETTRE et non le glyphe : c'est
       * exactement ce que le repli du moteur en aurait fait, et cela ne peut pas
       * se tromper sur laquelle des vingt-six c'est. */
      .replace(/&([A-Za-z])(opf|fr|scr);?/g, function (m, l) { return l; })

     * restaient dans le texte cherche, si bien qu'un mot coupe par l'une d'elles
     * n'etait plus le mot : TO_<span>FILL</span>_IN est dessine TO_FILL_IN par

  /* LES TEXTES A REMPLACER, HORS DE L'ARBRE. Le garde du moteur parcourt
   * l'arbre, et c'est son perimetre : le titre de la page, le grand titre, le
   * chapeau et le message affiche quand JavaScript ne s'execute pas n'en font
   * pas partie. Un message de repli livre avec un TO_FILL_IN dedans -- le seul
   * texte que voit un lecteur sans JavaScript -- a traverse un verdict
   * « publiable, rien a signaler » sans un mot, alors que le guide promet de
   * l'attraper « ou que ce soit ». Cette page lit deja tout ce que la page
   * montre : le controle manquait ici, pas dans le moteur. */
  function chromeSentinels(text, engine) {
    var issues = [];
    if (!engine || !engine.POLICY) return issues;
    var chrome = chromeText(text);
    arr(engine.POLICY.sentinels).forEach(function (word) {
      if (chrome.indexOf(word) >= 0) {
        /* Un avertissement, comme son voisin chromeTerm, et pour la meme
         * raison : le moteur ne lit pas la page, donc il PUBLIERA ceci tel
         * quel. « Publiable » reste vrai ; ce qui manquait etait le mot. Un
         * avertissement est compte dans la banniere et dessine dans le tableau
         * de coherence, ce qu'une erreur de structure n'est pas -- elle rangeait
         * dans l'arbre un defaut qui est dans la page. */
        issues.push({ level: 'warn', where: 'page',
          message: fmt(S.chromeSentinel, { sentinel: word }) });

  }
  function chromeTerms(text, engine, host, tree) {
    var issues = [];
    if (!engine || !engine.POLICY) return issues;
    var home = String(engine.POLICY.homeDomain || '');
    var declared = tree && isObject(tree.publisher) ? arr(tree.publisher.domains) : [];
    var ownFile = declared.length > 0 && declared.every(function (d) {
      return under(String(d).trim().toLowerCase(), home);
    });
    var atHome = host ? under(host, home) : ownFile;
    if (atHome) return issues;
    var chrome = chromeText(text);
    /* Read with the ENGINE'S OWN normaliser, never a copy of it: a second copy

     * the headline above them. An engine too old to lend one is read raw, which
     * is the verdict that engine gives everywhere else on this page too. */

        }

  }

  /* ---------------------------------------------------------------- render */

  function table(rows) {
    var t = el('table');
    var head = el('tr');
    [S.level, S.where, S.msg].forEach(function (h) { head.appendChild(el('th', null, h)); });
    t.appendChild(head);
    rows.forEach(function (r) {
      var tr = el('tr');
      tr.appendChild(el('td', 'lvl lvl-' + r.level, r.level === 'error' ? '✗' : '⚠'));
      tr.appendChild(el('td', null, r.where));
      tr.appendChild(el('td', null, r.message));
      t.appendChild(tr);
    });
    return t;
  }
  function fail(head, hint, detail) {
    out.appendChild(el('div', 'verdict v-bad', head));
    if (hint) out.appendChild(el('p', 'muted', hint));
    if (detail) out.appendChild(el('pre', null, detail));
  }

  function analyse(text) {
    out.textContent = '';

    var mk = markers(text);
    var eng = loadEngine(text);
    var loaded = loadContent(text);

    if (loaded.error) { fail(S.syntax, S.syntaxHint, String(loaded.error.message || loaded.error)); return null; }
    if (loaded.missing) { fail(loaded.head || S.noContent, loaded.hint || S.noContentHint); return null; }
    if (eng.error) { fail(S.engineBroken, null, String(eng.error.message || eng.error)); return null; }

    var tree = loaded.value;
    var engine = eng.value || null;
    var report = { tree: tree, engine: engine };

    var structureIssues = [], guardIssues = [], all = [], crashed = [];
    try { all = paths(tree); } catch (e) { crashed.push(e.message); }
    try { if (engine) structureIssues = engine.structure(tree); } catch (e) { crashed.push(e.message); }

     * failed check, and a failed check has to reach the banner rather than take
     * the whole render down after the banner has already said "publishable". */
    try { if (engine) report.hash = engine.fingerprint(tree); } catch (e) { crashed.push(e.message); }
    /* AND THE OTHER HALF. This page printed the fingerprint alone and told the
     * reader that nothing signed had moved. A copy that renamed its steps and
     * relabelled its buttons moved nothing the fingerprint covers, so the
     * sentence was drawn, in full, over a page whose every visible word around
     * the questions had changed. The engine has signed both since 3.0.18; this
     * page now shows both. */
    try { if (engine && engine.signature) report.sig = engine.signature(tree); }
    catch (e) { crashed.push(e.message); }

     * would otherwise skip the domain check in silence. Keep it as typed and let
     * the guard refuse it. */
    if (typed && !host) host = typed;
    try { if (engine) guardIssues = engine.guard(tree, host); } catch (e) { crashed.push(e.message); }
    var extra = [];
    try { extra = extras(tree, all, engine); } catch (e) { crashed.push(e.message); }
    var srcIssues = lintContent(text, tree);

    /* ai-go.html says this page lists the interface keys a language is missing.
     * It did not, and a third language went live half in English with a green
     * verdict. The engine ships English and French; anything else is the
     * adopter's to provide, key by key. */
    var uiIssues = [];
    if (engine && engine.UI && isObject(engine.UI.en)) {
      var shipped = Object.keys(engine.UI);
      var wanted = Object.keys(engine.UI.en);
      /* UNE LANGUE A REGION EST LA LANGUE. Le moteur sert « fr-CH » avec les
       * libelles de « fr » ; sans cette ligne, l'accuser de n'en fournir aucun
       * serait un reproche sur une page correcte. */
      var primary = function (l) { return String(l).toLowerCase().split(/[-_]/)[0]; };
      arr(tree.langs).forEach(function (l) {
        if (shipped.indexOf(l) >= 0 || shipped.indexOf(primary(l)) >= 0) return;
        var given = isObject(tree.ui) && isObject(tree.ui[l]) ? tree.ui[l] : {};
        /* `msg` EST UN OBJET, ET ON COMPTE CE QU'IL PORTE. L'exiger comme une
         * chaine accusait une langue traduite de bout en bout ; n'en verifier
         * que la FORME a echange ce faux positif contre un faux negatif, car
         * `msg: {}` -- la retouche exacte qu'on fait pour eteindre un
         * avertissement -- passait alors pour une traduction complete et
         * laissait les quarante-deux phrases de refus en anglais. Le moteur y
         * retombe phrase par phrase : on les compte phrase par phrase, et on

     * outside the calculation: a file carrying its content block twice, which

     * silently did nothing is exactly the kind of thing an adopter wants told. */
    var scriptRows = arr(loaded.run && loaded.run.errors).map(function (e) {

     * posee que sur la branche ou l'arbre reste introuvable : des qu'un script

      .concat(chromeIssues.filter(function (i) { return i.level === 'warn'; }))
      .concat(chromeSpaces(text)).concat(uiIssues)

    else if (errors.length) { cls = 'v-bad'; head = fmt(S.bad, { n: errors.length }); }
    else if (eng.missing) { cls = 'v-warn'; head = S.engineNone; }
    else if (guardIssues.length) { cls = 'v-warn'; head = fmt(S.notPublishable, { n: guardIssues.length }); }
    else if (warns.length) { cls = 'v-warn'; head = fmt(S.okWarn, { n: warns.length }); }

    var v = el('div', 'verdict ' + cls);
    v.appendChild(el('span', null, head));
    v.appendChild(el('small', null, fmt(S.counts, {
      nodes: Object.keys(tree.nodes || {}).length, results: Object.keys(tree.results || {}).length, paths: all.length
    })));
    v.appendChild(el('small', null, host ? fmt(S.verdictFor, { host: host }) : S.verdictForNone));
    out.appendChild(v);

    /* -------- the file itself */
    out.appendChild(el('h2', null, S.fileH));
    out.appendChild(el('p', 'muted', mk.ok ? S.markersOk : fmt(S.markersBad, { list: mk.wrong.join(', ') })));
    if (eng.missing) out.appendChild(el('p', 'muted', S.engineNone));
    else if (eng.declared && eng.declared.h === eng.computed) {
      out.appendChild(el('p', 'muted', fmt(S.engineIntact, { v: eng.declared.v })));
    } else if (eng.declared) {
      out.appendChild(el('p', null, fmt(S.engineChanged, { v: eng.declared.v, d: eng.declared.h, c: eng.computed })));
    }
    if (report.hash) {
      out.appendChild(el('p', 'mono', fmt(S.prints, { hash: report.hash })));
      out.appendChild(el('p', 'muted', S.printsLead));
      if (report.sig) {
        out.appendChild(el('p', 'mono', fmt(S.signs, { hash: report.sig })));
        out.appendChild(el('p', 'muted', S.signsLead));
      }
    }
    var meta = [];
    meta.push(tree.review && tree.review.date ? fmt(S.reviewed, { date: tree.review.date, by: tree.review.by || '?' }) : '! ' + S.noReview);
    if (tree.jurisdiction) meta.push(fmt(S.jurisdiction, { j: tree.jurisdiction }));
    if (tree.legalBasis) meta.push(fmt(S.legalBasis, { b: [].concat(tree.legalBasis).join(', ') }));
    out.appendChild(el('p', 'muted', meta.join(' · ')));

    /* -------- publication, from the engine of this very file */
    if (!eng.missing) {
      out.appendChild(el('h2', null, S.publication));
      out.appendChild(el('p', 'muted', host ? fmt(S.publicationLeadHost, { host: host }) : S.publicationLead));
      if (guardIssues.length) out.appendChild(table(guardIssues.map(function (g) {
        return { level: 'error', where: g.path, message: g.message };
      })));
      else if (errors.length) out.appendChild(el('p', null, fmt(S.publicationOkBlocked, { n: errors.length })));
      else out.appendChild(el('p', 'muted', S.publicationOk));
    }

    /* -------- coherence */
    out.appendChild(el('h2', null, S.coherence));
    out.appendChild(el('p', 'muted', S.coherenceLead));
    if (shownRows.length) out.appendChild(table(shownRows));
    else out.appendChild(el('p', 'muted', S.coherenceOk));

    if (srcIssues.length) {
      out.appendChild(el('h2', null, S.source));
      out.appendChild(table(srcIssues));
    }

    /* -------- paths */
    out.appendChild(el('h2', null, S.pathsH + ' (' + all.length + ')'));
    if (all.truncated) out.appendChild(el('p', null, S.truncated));
    out.appendChild(el('p', 'muted', S.pathsLead));
    var ul = el('ul', 'paths');
    all.map(pathKey).sort().forEach(function (k) { ul.appendChild(el('li', null, k)); });
    out.appendChild(ul);

    /* -------- update */
    out.appendChild(el('h2', null, S.updateH));
    out.appendChild(el('p', 'muted', S.updateLead));
    if (!previous) out.appendChild(el('p', 'muted', S.updateNone));
    else {
      var d = routingDiff(previous.tree, tree);
      out.appendChild(el('p', null, (d.added.length + d.removed.length)
        ? fmt(S.routingMoved, { a: d.added.length, r: d.removed.length })
        : fmt(S.routingSame, { n: d.unchanged })));
      if (previous.hash && report.hash) {
        out.appendChild(el('p', 'mono', previous.hash === report.hash
          ? fmt(S.printsSame, { h: report.hash })
          : fmt(S.printsMoved, { ho: previous.hash, hn: report.hash })));
      }
      if (previous.sig && report.sig) {
        out.appendChild(el('p', 'mono', previous.sig === report.sig
          ? fmt(S.signsSame, { h: report.sig })
          : fmt(S.signsMoved, { ho: previous.sig, hn: report.sig })));
      }
      if (d.added.length + d.removed.length) {
        var cul = el('ul', 'paths');
        d.removed.forEach(function (k) { cul.appendChild(el('li', null, '- ' + k)); });
        d.added.forEach(function (k) { cul.appendChild(el('li', null, '+ ' + k)); });
        out.appendChild(cul);
      }
    }
    /* What the banner counted and what the page drew, side by side, so the rule
     * "every counted warning is rendered somewhere" is something a test can
     * assert instead of something a comment can promise. */
    report.rows = { errors: errors, warns: warns, shown: shownRows.concat(srcIssues) };
    return report;
  }

  /* ------------------------------------------------------------ plumbing */

  function run(text, remember) {
    if (remember && last) previous = last;
    var r = analyse(text);
    if (r) { r.text = text; last = r; }
  }
  function label() {
    setText('t-title', S.title); setText('t-lead', S.lead); setText('t-drop', S.drop);
    setText('t-hostLabel', S.hostLabel); setText('t-langLabel', S.langLabel);
    setText('t-exec', S.exec); setText('t-foot', S.foot);
    setText('t-pasteHead', S.pasteHead); setText('pasteGo', S.pasteGo);
    ['fr', 'en'].forEach(function (code) {
      var b = document.getElementById('lang-' + code);
      if (b) b.setAttribute('aria-pressed', code === lang ? 'true' : 'false');
    });
  }
  function read(f) {
    var r = new FileReader();
    r.onload = function () { run(String(r.result), true); };
    r.readAsText(f, 'utf-8');
  }

  /* Everything above is pure. Under Node it is all the harness needs; in a
   * browser the page wires itself below. */
  var API = {
    S: S, MARKS: MARKS, NBSP: NBSP, NNBSP: NNBSP, markers: markers, mountNames: mountNames,
    contentBlock: contentBlock, contentRange: contentRange, engineBlock: engineBlock,
    innerScript: innerScript, canonicalBlock: canonicalBlock, inlineScripts: inlineScripts, markupOnly: markupOnly,
    runFile: runFile, hashOf: hashOf, walkStrings: walkStrings,
    loadContent: loadContent, loadEngine: loadEngine,
    paths: paths, pathKey: pathKey, routingDiff: routingDiff,
    extras: extras, lintContent: lintContent, chromeText: chromeText, chromeTerms: chromeTerms, chromeSentinels: chromeSentinels, chromeSpaces: chromeSpaces, analyse: analyse,
    setLang: setLang, lang: function () { return lang; }
  };
  if (typeof document === 'undefined') return API;

  /* WHICH LANGUAGE THIS PAGE OPENS IN. The reader decides, in this order: the
   * choice they made in this tab, then the languages their browser asks for,
   * then the one this file ships with, which is French. `documentElement` is
   * what says a real page is being rendered: loaded as a library, by the
   * harness or by a script of your own, there is no page and no reader, the
   * base table stands, and the same file therefore reads the same on every
   * machine.
   *
   * WHY THE WHOLE LIST, AND NOT navigator.language. That property is ONE tag,
   * the first of the list, and a browser configured in a language this page is
   * not written in reports that one: a delegate whose browser announced
   * "fr-FR" was served this page in English because her list read
   * ["de-CH", "fr-FR", "en"] and only the head of it was read. The list is
   * ordered by the reader's own preference, so the first entry this page can
   * honour is the right answer; navigator.language stays as the fallback for a
   * browser too old to carry the list.
   *
   * WHY THE CHOICE IS KEPT, AND WHERE. Clicking English and reloading gave
   * English for one second and the browser's answer for good, which reads as a
   * button that does not work. It is kept in sessionStorage, the storage the
   * engine already uses for its answers: it dies with the tab, it never
   * crosses to another machine, and a reload keeps it. Only the CHOICE is
   * kept, never a file and never a verdict: two people comparing two verdicts
   * still compare two verdicts, in whichever language each of them reads. Both
   * calls are wrapped, because a file:// page in a browser set to refuse site
   * data throws on the accessor itself, and a validator that blanks on a
   * storage setting is worse than one that forgets. */
  var PAGE_LANGS = ['fr', 'en'];
  var LANG_KEY = 'aigo:check:lang';
  function primaryTag(tag) { return String(tag == null ? '' : tag).split(/[-_]/)[0].toLowerCase(); }
  function remembered() {
    try {
      var v = window.sessionStorage.getItem(LANG_KEY);
      return PAGE_LANGS.indexOf(v) >= 0 ? v : null;
    } catch (e) { return null; }
  }
  function remember(code) {
    try { window.sessionStorage.setItem(LANG_KEY, code); } catch (e) { /* storage refused */ }
  }
  function preferred() {
    var root = document.documentElement;
    if (!root || typeof root.getAttribute !== 'function') return 'en';
    var kept = remembered();
    if (kept) return kept;
    /* Array-like, not an array, in more than one browser: read by length. */
    var nav = typeof navigator !== 'undefined' ? navigator : null;
    var list = nav && nav.languages && typeof nav.languages.length === 'number' ? nav.languages : [];
    var asked = [];
    for (var i = 0; i < list.length; i++) asked.push(list[i]);
    if (nav && nav.language) asked.push(nav.language);
    for (var j = 0; j < asked.length; j++) {
      if (PAGE_LANGS.indexOf(primaryTag(asked[j])) >= 0) return primaryTag(asked[j]);
    }
    /* Neither: the language this file is written in, which its own markup
     * declares. English only if that markup says English. */
    return primaryTag(root.getAttribute('lang')) === 'en' ? 'en' : 'fr';
  }
  /* setLang fills the table; this carries the choice into the document, so that
   * a screen reader changes voice with the page and the tab is named in the
   * language the reader is reading. */
  function speak(code) {
    setLang(code);
    var root = document.documentElement;
    if (root && typeof root.setAttribute === 'function') root.setAttribute('lang', lang);
    try { document.title = S.pageTitle; } catch (e) { /* not a page: nothing to name */ }
  }
  /* Exported so the harness can assert the rule rather than a screenshot of it:
   * the reader's list in, one of the two languages out. */
  API.preferred = preferred;
  speak(preferred());

  out = document.getElementById('out');
  drop = document.getElementById('drop');
  file = document.getElementById('file');
  paste = document.getElementById('paste');

  document.getElementById('pasteGo').addEventListener('click', function () {
    if (paste.value.trim()) run(paste.value, true);
  });
  file.addEventListener('change', function () { if (file.files[0]) read(file.files[0]); });
  drop.addEventListener('click', function (e) { if (e.target !== file) file.click(); });
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) { if (e.dataTransfer.files[0]) read(e.dataTransfer.files[0]); });

  /* The domain is half the verdict. Typed after the file was dropped, it used to
   * change nothing on screen: the reader was left with a verdict computed for
   * another domain. Re-run the analysis on the file already loaded, without
   * touching `previous`, which belongs to the update comparison. */
  var hostTimer = null;
  function reanalyse() { if (last && last.text) run(last.text, false); }
  var hostField = document.getElementById('host');
  hostField.addEventListener('change', reanalyse);
  hostField.addEventListener('input', function () {
    if (hostTimer) clearTimeout(hostTimer);
    hostTimer = setTimeout(reanalyse, 400);
  });

  ['fr', 'en'].forEach(function (code) {
    var b = document.getElementById('lang-' + code);
    if (!b) return;
    b.addEventListener('click', function () {
      /* Remembered on the CLICK and nowhere else: what is kept is a decision a
       * reader made, never a language this page guessed for them. */
      remember(code);
      speak(code); label();
      /* The verdict is chrome too: re-render it in the language just chosen,
       * without touching `previous`, which belongs to the update comparison. */
      if (last && last.text) run(last.text, false);
    });
  });

  label();
  return API;
})();
</script>
</body>
</html>
