  /* id: short and unique, change it when you adapt someone else's tree.
     version: yours; a session saved under another version is dropped instead
     of being resumed on the wrong questions.
     langs: every declared language requires every text. Keep one language and
     every text stays a plain string. */
  id: "my-questionnaire",
  version: "1.0.0",
  langs: ["en"],
  defaultLang: "en",
  start: "q1",

  /* SIGNATURE. The engine REFUSES to display anything while a TO_FILL_IN
     placeholder remains, or when the hostname of the page is not covered by
     publisher.domains. Declare your staging host too. A subdomain of a
     declared domain is covered; another domain is not. */
  publisher: { name: "TO_FILL_IN", domains: ["TO_FILL_IN"] },

  /* Who reviewed this content, and when (YYYY-MM-DD). Printed under every
     result with the content fingerprint: it is the link between the sheet your
     legal service signed and the page that is online. */
  review: { by: "TO_FILL_IN", date: "TO_FILL_IN" },

  /* Which law this tree encodes, e.g. "CH-VD" or "DE-BY". Read by check.html,
     never by the questionnaire. */
  jurisdiction: "TO_FILL_IN",
  legalBasis: ["TO_FILL_IN"],

  /* Rendered under every result, required in every declared language. Replace
     the whole text with your own, validated in your institution. */
  disclaimer: "**Disclaimer:** a decision-support tool, it does not replace legal advice. The user remains responsible for the final assessment. TO_FILL_IN",

  /* ANOTHER INTERFACE LANGUAGE. The engine ships English labels and a French
     set. For any other language, declare it in `langs`, give every text its
     variant, and put your own button labels here: they live in YOUR half of
     the file and survive engine updates. The keys are listed in the README.

  ui: { de: { back: "Zurueck", continue: "Weiter", yes: "Ja", no: "Nein",
              stepOf: "Schritt {n} von {total}", resultLabel: "Ergebnis",
              restart: "Fragebogen neu starten", progressLabel: "Fortschritt",
              solutionLabel: "Empfohlene Loesung", allowedLabel: "Erlaubte Werkzeuge",
              forbiddenLabel: "Verboten:", newTab: "(oeffnet in einem neuen Tab)" } },
  */

  /* THE STEPS, the breadcrumb. "Step 2 of 3" is derived from this list: no
     total frozen in a string. Each question points at one step with `step`;
     several questions may share one. */
  steps: [
    { id: "s1", name: "Type of data" },
    { id: "s2", name: "Sensitivity" },
    { id: "s3", name: "Sharing" }
  ],

  /* THE LINKS, declared once and referenced by id from the results. A person
     translating never sees a URL, so cannot break one. external: true adds
     target, rel="noopener noreferrer" and the spoken "opens in a new tab".
     Accepted schemes: https, http, mailto, tel, and relative paths. */
  links: {
    guide:   { label: "Internal guide", external: true, href: "https://example.org/guide" },
    contact: { label: "Contact the relevant unit", external: true, href: "https://example.org/contact" }
  },

  nodes: {

    /* SINGLE CHOICE. Each answer carries its own destination: `to` for a
       question, `result` for an outcome. `label` is omitted on "yes" and "no":
       the engine then uses its own Yes / No, so adding an interface language
       costs two strings and not two per question. `detail` is the line shown
       under the label. */
    q1: {
      type: "single",
      step: "s1",
      title: "Does your data concern people?",
      help: "Directly or indirectly.",
      answers: [
        { value: "yes", to: "q2", detail: "Yes, this is personal data" },
        { value: "no",  to: "q3", detail: "No, no individual is concerned" }
      ]
    },

    /* CHECKBOXES. The routing is a property of the WHOLE set of boxes, "at
       least one ticked" against "none", never of one box taken alone. Adding
       an option changes nothing else.

       `polarity` is a declaration for reviewers, checked but never used by the
       engine: "direct" when ticking leads to the more cautious outcome, which
       is the ordinary case, "inverse" when ticking is what takes the reader
       OUT of the cautious branch. Declare it, so the intent survives
       translation and review. Someone acting in good faith who "corrects" an
       inverse question to match the others sends low-risk data into the
       restrictive branch. */
    q2: {
      type: "multi",
      step: "s2",
      polarity: "direct",
      title: "Does this data fall into a sensitive category?",
      help: "**Tick everything that applies, or continue if nothing applies.**",
      options: [
        { value: "health",   label: "Health" },
        { value: "opinions", label: "Opinions or beliefs" },
        { value: "legal",    label: "Legal proceedings" }
      ],
      /* ifAny / ifAnyResult: at least one box ticked. else / elseResult: none.
         ifAny and else take a question id, ifAnyResult and elseResult take a
         result id. */
      next: { ifAnyResult: "restricted", else: "q3" }
    },

    q3: {
      type: "single",
      step: "s3",
      title: "Is sharing of this data restricted?",
      help: "For example: a confidentiality agreement, professional secrecy.",
      answers: [
        { value: "yes", result: "restricted", detail: "At least one restriction applies" },
        { value: "no",  result: "open",       detail: "Sharing is unrestricted" }
      ]
    }
  },

  /* THE RESULTS, the outcomes.
     level: "success" | "info" | "warning" | "danger", the colour of the card.
     solution.label: "plain" (default) or "legal" reuses an engine label; any
       other string is your own text.
     allowed: link ids, listed under "Permitted tools".
     forbidden: texts, listed under "Prohibited".
     alert: one more boxed remark, with its own level. */
  results: {

    open: {
      level: "success",
      title: "No particular restriction",
      summary: "This questionnaire identifies no constraint on your data.",
      solution: { label: "plain", text: "Unrestricted use" },
      allowed: ["guide"]
    },

    restricted: {
      level: "warning",
      title: "Restricted use",
      summary: "Your data requires particular care.",
      solution: { label: "legal", text: "Internal solutions only" },
      allowed: ["guide", "contact"],
      forbidden: ["No external service without a contract"],
      alert: {
        level: "warning",
        text: "**To check:** this text is an example. Replace it with your own analysis, validated in your institution."
      }
    }
  }
};

    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return ('00000000' + (h >>> 0).toString(16)).slice(-8);
  }
  /* Never throws: check.html calls it on whatever file was dropped on it. */
  function fingerprint(tree) {
    var t = isObject(tree) ? tree : {};
    try { return hash(JSON.stringify({ s: t.start, n: t.nodes, r: t.results, l: t.links })); }
    catch (e) { return '????????'; }   /* self-referential: nothing to sign */
  }

  /* ===========================================================================
   * 6. VIEWS
   *
   * Rendering functions: they read the instance state and append DOM nodes to
   * `host`, and they never look outside the instance root. Not pure: the
   * handlers they attach record the answer and ask the instance to save, which
   * is the whole point of a question. Each returns the element that should
   * receive focus after a navigation.
   * ======================================================================== */

  var groupSeq = 0;   // radio group names must be unique per rendering, even across instances

  /* English base, overridden by the shipped label set for the language, then by
   * the tree's own `ui`. A language the engine does not know is served entirely
   * by the tree. */
  function makeStrings(lang, tree) {
    var s = {};
    Object.keys(UI.en).forEach(function (k) { s[k] = UI.en[k]; });
    var shipped = lang === 'en' ? null : UI[lang];
    if (shipped) Object.keys(shipped).forEach(function (k) { s[k] = shipped[k]; });
    var custom = isObject(tree && tree.ui) ? tree.ui[lang] : null;
    if (custom) Object.keys(custom).forEach(function (k) { if (own(s, k)) s[k] = custom[k]; });
    return s;
  }

  function text(inst, value) { return pickLang(value, inst.lang, inst.fallbacks); }
  function currentNode(inst) { return inst.path[inst.path.length - 1]; }

  function button(cls, label, onClick) {
    var b = el('button', 'aigo-btn ' + cls, label);
    b.type = 'button';   // never a submit button: the host page may be a CMS form
    b.addEventListener('click', onClick);
    return b;
  }
  /* Back appears as soon as there is something to go back to. */
  function renderButtons(inst, primaryLabel, onPrimary) {
    var row = el('div', 'aigo-buttons');
    if (inst.path.length > 1 || inst.result) row.appendChild(button('aigo-btn-ghost', inst.s.back, inst.back));
    row.appendChild(button('aigo-btn-primary', primaryLabel, onPrimary));
    return row;
  }

  /* Progress header. Returns the step label ("Step 2 of 10"), used by the live
   * announcement, or null when the tree declares no steps. */
  function renderProgress(inst, host) {
    var tree = inst.tree, s = inst.s;
    var steps = arr(tree.steps);
    if (!steps.length) return null;
    var node = inst.result ? null : tree.nodes[currentNode(inst)];
    var curIndex = -1;
    steps.forEach(function (st, i) { if (node && st && st.id === node.step) curIndex = i; });

    /* Steps actually visited come from the path, not from numbering. Skipped
     * steps stay visibly skipped: that is information about the reasoning. */
    var visited = Object.create(null);
    inst.path.forEach(function (id) { if (own(tree.nodes, id)) visited[tree.nodes[id].step] = true; });

    var label = inst.result
      ? s.resultLabel
      : fmt(s.stepOf, { n: (curIndex + 1) + (node && node.stepSuffix ? node.stepSuffix : ''), total: steps.length });
    var meta = el('div', 'aigo-progress-meta');
    meta.appendChild(el('span', 'aigo-eyebrow', s.progressLabel));
    meta.appendChild(el('span', 'aigo-progress-text', label));
    host.appendChild(meta);

    /* Decorative: the information is carried by the label above and by the live
     * region. A screen reader has no reason to cross ten dots. */
    var bar = el('div', 'aigo-steps');
    bar.setAttribute('aria-hidden', 'true');
    steps.forEach(function (st, i) {
      var state = 'todo';
      if (!inst.result && i === curIndex) state = 'current';
      else if (st && visited[st.id] === true && (inst.result || i !== curIndex)) state = 'done';
      else if (inst.result || i < curIndex) state = 'skipped';
      bar.appendChild(el('span', 'aigo-step aigo-step-' + state));
    });
    host.appendChild(bar);

    if (!inst.result && curIndex >= 0) host.appendChild(el('p', 'aigo-step-name', text(inst, steps[curIndex].name)));
    return label;
  }

  function renderQuestion(inst, host) {
    var id = currentNode(inst);
    var node = inst.tree.nodes[id];
    var view = el('section', 'aigo-question');
    var title = el('h' + inst.headingLevel, 'aigo-title', text(inst, node.title));
    title.setAttribute('tabindex', '-1');
    view.appendChild(title);
    if (node.help) {
      var help = el('div', 'aigo-help');
      renderText(help, node.help, inst.lang, inst.fallbacks);
      view.appendChild(help);
    }
    if (node.type === 'multi') renderMulti(inst, view, id, node); else renderSingle(inst, view, id, node);
    host.appendChild(view);
    return title;
  }

  /* Checkbox question. Ticking only records the answer; Continue routes. */
  function renderMulti(inst, view, id, node) {
    /* fieldset/legend: tabbing through the boxes re-announces the question.
     * Without it one hears "Health" without knowing which question. */
    var fs = el('fieldset', 'aigo-fieldset');
    fs.appendChild(el('legend', 'aigo-sr-only', text(inst, node.title)));
    var checked = Array.isArray(inst.answers[id]) ? inst.answers[id].slice() : [];
    arr(node.options).forEach(function (o) {
      var lab = el('label', 'aigo-check');
      var input = document.createElement('input');
      input.type = 'checkbox';
      input.value = o.value;
      input.checked = checked.indexOf(o.value) >= 0;
      input.addEventListener('change', function () {
        var at = checked.indexOf(o.value);
        if (input.checked && at < 0) checked.push(o.value);
        if (!input.checked && at >= 0) checked.splice(at, 1);
        inst.answers[id] = checked.slice();
        inst.save();
      });
      lab.appendChild(input);
      var span = el('span');
      inlineInto(span, text(inst, o.label));
      lab.appendChild(span);
      fs.appendChild(lab);
    });
    view.appendChild(fs);
    inst.answers[id] = checked;
    view.appendChild(renderButtons(inst, inst.s.continue, function () { inst.answer(id, inst.answers[id] || []); }));
  }

  /* Radio question. The `change` event only records the answer. Navigation
   * happens on Continue, or on a MOUSE click: arrow keys also fire `click`
   * (with detail 0), and reading the "No" option must never propel the reader
   * into the next question. */
  function renderSingle(inst, view, id, node) {
    var s = inst.s;
    /* fieldset/legend, exactly as renderMulti: without it a screen reader
     * announces "Yes" with no idea which question it answers. */
    var fs = el('fieldset', 'aigo-fieldset');
    fs.appendChild(el('legend', 'aigo-sr-only', text(inst, node.title)));
    var group = el('div', 'aigo-options');
    var name = 'aigo-' + (++groupSeq) + '-' + id;
    var chosen = typeof inst.answers[id] === 'string' ? inst.answers[id] : null;
    arr(node.answers).forEach(function (a) {
      var lab = el('label', 'aigo-option');
      var input = document.createElement('input');
      input.type = 'radio';
      input.name = name;
      input.value = a.value;
      input.checked = chosen === a.value;
      input.addEventListener('change', function () { inst.answers[id] = a.value; inst.save(); });
      input.addEventListener('click', function (ev) {
        if (ev.detail === 0) return;
        inst.answers[id] = a.value;
        inst.answer(id, a.value);
      });
      lab.appendChild(input);
      var wrap = el('span', 'aigo-option-text');
      wrap.appendChild(el('span', 'aigo-option-label', text(inst, a.label) || s[a.value] || a.value));
      if (a.detail) {
        var det = el('span', 'aigo-option-detail');
        inlineInto(det, text(inst, a.detail));
        wrap.appendChild(det);
      }
      lab.appendChild(wrap);
      group.appendChild(lab);
    });
    fs.appendChild(group);
    view.appendChild(fs);
    view.appendChild(renderButtons(inst, s.continue, function () {
      var v = inst.answers[id];
      if (typeof v !== 'string') {
        /* Nothing chosen. Moving the focus is not enough: a screen reader user
         * hears nothing and cannot tell that the click was refused. */
        var first = view.querySelector('input');
        if (first) first.focus();
        inst.announce(s.chooseOne);
        return;
      }
      inst.answer(id, v);
    }));
  }

  /* A link whose host is not one of the publisher's domains is shown WITH that
   * host next to its label. An institution that adapted a tree and left a link
   * to the source behind cannot hide it from its own readers, and neither can
   * the institution that copies that adaptation in turn. */
  function renderLink(inst, linkId) {
    var link = inst.tree.links[linkId];
    var li = el('li');
    var a = el('a', 'aigo-link');
    /* Texts are safe by construction (no innerHTML); a URL is not, since a
     * script scheme runs on click. Scheme allow-list; anything else is inert. */
    a.href = safeHref(link.href) || '#';
    a.textContent = text(inst, link.label);
    if (link.external) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.appendChild(el('span', 'aigo-sr-only', ' ' + inst.s.newTab));
    }
    li.appendChild(a);
    var host = hostOf(link.href);
    var owned = arr(inst.tree.publisher && inst.tree.publisher.domains);
    if (host && !owned.some(function (d) { return endsWithDomain(host, d); })) {
      li.appendChild(el('span', 'aigo-foreign-host', ' (' + host + ')'));
    }
    return li;
  }

  function renderResult(inst, host) {
    var tree = inst.tree, s = inst.s;
    var r = tree.results[inst.result];
    var view = el('section', 'aigo-result');

    var banner = el('div', 'aigo-alert aigo-alert-' + (r.level || 'info'));
    /* A heading, not a <strong>: the verdict is what a screen reader user jumps
     * to, and heading navigation is how they jump. */
    var head = el('h' + inst.headingLevel, 'aigo-result-title', text(inst, r.title));
    head.setAttribute('tabindex', '-1');
    banner.appendChild(head);
    if (r.summary) renderText(banner, r.summary, inst.lang, inst.fallbacks);
    view.appendChild(banner);

    if (r.solution) {
      var sol = el('div', 'aigo-solution');
      /* label: "plain" (default) | "legal" | a text of the tree's own. */
      var label = r.solution.label === 'legal' ? s.solutionLabelLegal
                : (!r.solution.label || r.solution.label === 'plain') ? s.solutionLabel
                : text(inst, r.solution.label);
      sol.appendChild(el('div', 'aigo-solution-label', label));
      var solText = el('div', 'aigo-solution-text');
      inlineInto(solText, text(inst, r.solution.text));
      sol.appendChild(solText);
      view.appendChild(sol);
    }

    if (arr(r.allowed).length) view.appendChild(renderBlock(s.allowedLabel, arr(r.allowed).map(function (id) {
      return own(tree.links, id) ? renderLink(inst, id) : null;
    })));
    if (arr(r.forbidden).length) view.appendChild(renderBlock(s.forbiddenLabel, arr(r.forbidden).map(function (t) {
      var li = el('li');
      inlineInto(li, text(inst, t));
      return li;
    })));

    if (r.alert) {
      var alert = el('div', 'aigo-alert aigo-alert-' + (r.alert.level || 'info'));
      renderText(alert, r.alert.text, inst.lang, inst.fallbacks);
      view.appendChild(alert);
    }

    view.appendChild(renderButtons(inst, s.restart, function () { inst.restart(); }));

    if (tree.disclaimer) {
      var disc = el('div', 'aigo-alert aigo-alert-info aigo-disclaimer');
      renderText(disc, tree.disclaimer, inst.lang, inst.fallbacks);
      view.appendChild(disc);
    }
    view.appendChild(renderFooter(inst));
    host.appendChild(view);
    return head;
  }

  function renderBlock(title, items) {
    var block = el('div', 'aigo-block');
    block.appendChild(el('div', 'aigo-block-title', title));
    var ul = el('ul', 'aigo-list');
    items.forEach(function (li) { if (li) ul.appendChild(li); });
    block.appendChild(ul);
    return block;
  }

  /* Publisher, review date, attribution and the content fingerprint. The
   * review date is INTERFACE information: it tells the reader whether the
   * recommendation they just received is six months or six years old. */
  function renderFooter(inst) {
    var tree = inst.tree, s = inst.s;
    var foot = el('div', 'aigo-review');
    if (tree.review && tree.review.date) {
      var signed = tree.publisher && tree.publisher.name ? tree.publisher.name + ' · ' : '';
      foot.appendChild(el('p', null, signed + fmt(s.reviewedOn, { date: tree.review.date, by: tree.review.by || '?' })));
      var age = reviewAgeDays(tree);
      if (age !== null && age > POLICY.reviewMaxDays) foot.appendChild(el('p', 'aigo-review-expired', fmt(s.expiredReview, { days: POLICY.reviewMaxDays })));
    }
    /* derivedFrom: "Name" or { name, url }. The attribution names the source
     * and says it has not reviewed the adaptation. attribution: false hides it.
     * It is not a lock: it is the disclosure an honest adopter can make, and
     * the README asks for it in as many words. */
    var source = tree.derivedFrom && (typeof tree.derivedFrom === 'string' ? tree.derivedFrom : tree.derivedFrom.name);
    if (source && tree.attribution !== false) foot.appendChild(el('p', 'aigo-attribution', fmt(s.attribution, { source: source })));
    foot.appendChild(el('p', 'aigo-content-id', fmt(s.contentId, { hash: fingerprint(tree), version: VERSION })));
    return foot;
  }

  /* Refusal box: the only thing displayed when content is not publishable. */
  function renderRefusal(root, issues, lang) {
    var s = makeStrings(lang || 'en', null);
    root.textContent = '';
    var box = el('div', 'aigo aigo-error');
    box.setAttribute('role', 'alert');
    box.appendChild(el('strong', null, s.notPublished));
    box.appendChild(el('p', null, s.notPublishedLead));
    var ul = el('ul');
    issues.forEach(function (i) {
      var li = el('li');
      li.appendChild(el('code', null, i.path));
      li.appendChild(document.createTextNode(': ' + i.message));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    root.appendChild(box);
  }

  /* ===========================================================================
   * 7. THE INSTANCE
   *
   * mount(root, tree, options) returns the instance, or null when the tree is
   * refused (the refusal is rendered in `root`). Options:
   *   lang          interface and content language (default: tree.defaultLang)
   *   storageKey    sessionStorage key, null to disable (default: "aigo:" + id)
   *   history       push one browser history entry per step (default: true)
   *   headingLevel  1..6, the heading level of question titles (default: 2)
   *   mode          "strict" (default off localhost) refuses non-publishable
   *                 content; "preview" displays it with a banner
   *   resume        restore a saved session if any (default: true)
   * ======================================================================== */

  /* Keys held by live instances, so that a second mount takes its own. */
  var liveKeys = Object.create(null);
  function claimKey(base) {
    var k = base, i = 1;
    while (liveKeys[k]) k = base + '#' + (++i);
    liveKeys[k] = true;
    return k;
  }
  function mount(root, tree, options) {
    if (!root) throw new Error('AI_GO.mount: missing container.');
    var opt = options || {};
    var lang = opt.lang || (tree && tree.defaultLang) || (tree && arr(tree.langs)[0]) || 'en';

    /* A missing tree is the most common failure: a forgotten comma in the
     * content block, and the script never defined the variable. */
    if (!tree || !tree.nodes || !tree.start) {
      root.textContent = '';
      var box = el('div', 'aigo aigo-error');
      box.appendChild(el('p', null, makeStrings(lang, null).loadError));
      root.appendChild(box);
      return null;
    }

    var hostname = (typeof location !== 'undefined' && location.hostname) || '';
    /* An empty hostname means a page opened by double-click (file:), but also
     * an about:srcdoc or blob: frame inside a real site: only file: previews. */
    var protocol = (typeof location !== 'undefined' && location.protocol) || 'file:';
    var local = hostname ? isLocalHost(hostname) : protocol === 'file:';
    var mode = opt.mode || (local ? 'preview' : 'strict');
    var issues;
    try {
      /* Naming the local host rather than passing "" keeps the origin exemption
       * for a file:// preview without granting it to an unknown host, such as an
       * about:srcdoc frame inside someone else's site. */
      issues = structure(tree).concat(guard(tree, local ? 'localhost' : hostname));
    } catch (e) { issues = [{ path: 'guard', message: phrase('renderFailed', { error: e && e.message }) }]; }
    if (issues.length && mode !== 'preview') {
      renderRefusal(root, issues, lang);
      return null;
    }

    /* Two containers carrying the same tree are two questionnaires, not one:
     * sharing a key would make the second resume the first one's answers, and a
     * single browser Back would move both. */
    var defaultKey = claimKey('aigo:' + (tree.id || 'tree'));
    var inst = {
      root: root, tree: tree, issues: issues, mode: mode, lang: lang,
      s: makeStrings(lang, tree),
      fallbacks: fallbackLangs(tree),
      storageKey: opt.storageKey === null ? null : (opt.storageKey || defaultKey),
      useHistory: opt.history !== false,
      headingLevel: Math.min(6, Math.max(1, parseInt(opt.headingLevel, 10) || 2)),
      path: [tree.start],
      answers: Object.create(null),
      result: null,
      live: el('div', 'aigo-sr-only'),   // the live region, created once and re-attached at every render
      historyDepth: 0                    // entries this instance pushed; Back lets the browser pop them
    };
    inst.live.setAttribute('role', 'status');
    inst.live.setAttribute('aria-live', 'polite');
    /* History entries are tagged so that two instances on one page only react
     * to their own entries. */
    var historyTag = inst.storageKey || defaultKey;

    /* ---------------------------------------------------------- persistence
     * sessionStorage only, never localStorage: keeping "this person declares
     * handling health data" between two visits, in a tool whose subject IS data
     * protection, would be indefensible. Answers live in the session and in the
     * tab's history stack, and die with the tab. */
    function snapshot() {
      return { path: inst.path.slice(), answers: inst.answers, result: inst.result, tv: tree.version, lang: inst.lang };
    }
    function save() {
      if (!inst.storageKey) return;
      try { sessionStorage.setItem(inst.storageKey + ':state', JSON.stringify(snapshot())); } catch (e) {}
    }
    function readSession() {
      if (!inst.storageKey) return false;
      try {
        var raw = sessionStorage.getItem(inst.storageKey + ':state');
        return raw ? restore(JSON.parse(raw)) : false;
      } catch (e) { return false; }
    }
    /* A tab opened before a redeployment may reference a removed node or an
     * older tree version. Restoring blindly would leave a blank area with no
     * way out: the state is rejected and the reader is told. */
    function restore(state) {
      if (!state || !Array.isArray(state.path) || !state.path.length) return false;
      var sameVersion = state.tv === undefined || tree.version === undefined || state.tv === tree.version;
      var known = state.path.every(function (id) { return own(tree.nodes, id); });
      var okResult = !state.result || own(tree.results, state.result);
      if (!sameVersion || !known || !okResult) { announce(inst.s.staleError); return false; }
      inst.path = state.path.slice();
      /* A session written before an option was renamed, or edited by hand, can
       * hold values the tree no longer offers. They showed no ticked box and yet
       * routed as though one were ticked. Keep only what the tree still offers. */
      inst.answers = Object.create(null);
      var saved = isObject(state.answers) ? state.answers : {};
      Object.keys(saved).forEach(function (id) {
        if (!own(tree.nodes, id)) return;
        var node = tree.nodes[id], v = saved[id];
        if (node.type === 'multi') {
          if (!Array.isArray(v)) return;
          var offered = arr(node.options).map(function (o) { return o && o.value; });
          inst.answers[id] = v.filter(function (x) { return offered.indexOf(x) >= 0; });
        } else if (arr(node.answers).some(function (a) { return a && a.value === v; })) {
          inst.answers[id] = v;
        }
      });
      inst.result = state.result || null;
      if (state.lang && arr(tree.langs).indexOf(state.lang) >= 0) setLang(state.lang, true);
      return true;
    }

    /* --------------------------------------------------------- announcements
     * A live region only speaks when its content CHANGES: reaching the same
     * result twice in a row would stay silent. So clear, then refill on the
     * frame after next. requestAnimationFrame is suspended in a background tab,
     * which would lose the announcement entirely, so a timer races it and the
     * first one to arrive wins. The property is TESTED and then CALLED, never
     * tested on window and called as a bare global. */
    function announce(msg) {
      inst.live.textContent = '';
      var done = false;
      var fill = function () { if (done) return; done = true; inst.live.textContent = msg; };
      var raf = window.requestAnimationFrame;
      if (raf) raf(function () { raf(fill); });
      setTimeout(fill, 50);
    }
    inst.announce = announce;

    /* --------------------------------------------------------------- routing
     * The only branching rule of a checkbox question: "at least one ticked"
     * versus "none". `polarity` changes NOTHING here: it is a declaration for
     * human review. A polarity that altered behaviour would be one more trap. */
    function nextFrom(nodeId, value) {
      var node = tree.nodes[nodeId];
      if (node.type === 'multi') {
        var rule = isObject(node.next) ? node.next : {};
        return Array.isArray(value) && value.length
          ? { to: rule.ifAny, result: rule.ifAnyResult }
          : { to: rule.else, result: rule.elseResult };
      }
      var a = arr(node.answers).filter(function (x) { return x && x.value === value; })[0];
      return a ? { to: a.to, result: a.result } : {};
    }
    function answer(nodeId, value) {
      inst.answers[nodeId] = value;
      var next = nextFrom(nodeId, value);
      if (next.result && own(tree.results, next.result)) { inst.result = next.result; render(true); }
      else if (next.to && own(tree.nodes, next.to)) { inst.path.push(next.to); inst.result = null; render(true); }
      /* An unresolved target is refused at mount time, so this branch is only
       * reachable in preview mode. It says so instead of doing nothing. */
      else renderRefusal(root, [{ path: 'nodes.' + nodeId, message: phrase('noTarget') }], inst.lang);
    }
    /* Back = pop. With history on, the browser pops and onPop restores the
     * previous state, so this button and the browser's never disagree. */
    function back() {
      if (!inst.result && inst.path.length < 2) return;
      if (inst.useHistory && inst.historyDepth > 0) { inst.historyDepth--; history.back(); return; }
      if (inst.result) inst.result = null; else inst.path.pop();
      render(false, true);
    }
    function resetToStart() {
      inst.path = [tree.start];
      inst.answers = Object.create(null);
      inst.result = null;
    }
    function restart() { resetToStart(); render(true); }
    function setLang(l, quiet) {
      if (arr(tree.langs).indexOf(l) < 0) return;
      inst.lang = l;
      inst.s = makeStrings(l, tree);
      if (!quiet) render(false);
    }

    /* ---------------------------------------------------------------- render
     * `push` is true for a forward navigation: focus moves, the change is
     * announced, the page scrolls and a history entry is pushed. Anything not
     * foreseen ends as a refusal in the container rather than an empty one
     * (principle 6). */
    function render(push, speak) {
      try { paint(push, speak); }
      catch (e) {
        renderRefusal(root, [{ path: 'render', message: phrase('renderFailed', { error: e && e.message }) }], inst.lang);
      }
    }
    function paint(push, speak) {
      root.textContent = '';
      root.classList.add('aigo');
      root.appendChild(inst.live);

      var main = el('div', 'aigo-main');
      var stepLabel = renderProgress(inst, main);
      var focusTarget = inst.result ? renderResult(inst, main) : renderQuestion(inst, main);
      root.appendChild(main);

      if (push || speak) {
        /* preventScroll: moving the focus scrolls by default, which would
         * cancel the deliberate repositioning below. */
        focusTarget.focus({ preventScroll: true });
        var title = inst.result ? text(inst, tree.results[inst.result].title) : text(inst, tree.nodes[currentNode(inst)].title);
        var lead = inst.result ? inst.s.resultLabel : stepLabel;
        announce((lead ? lead + inst.s.colon : '') + (title || ''));
        try { root.scrollIntoView({ block: 'start', behavior: reducedMotion() ? 'auto' : 'smooth' }); }
        catch (e) { root.scrollIntoView(); }
      }

      save();
      if (inst.useHistory) {
        try {
          if (push) { history.pushState({ aigo: historyTag, s: snapshot() }, ''); inst.historyDepth++; }
          /* Not a push: a Back that walked the path by hand, after a reload for
           * instance. The entry we stand on still describes the view we just
           * left, and the next browser Back would return to it. */
          else history.replaceState({ aigo: historyTag, s: snapshot() }, '');
        } catch (e) {}
      }
      root.setAttribute('lang', inst.lang);
      root.setAttribute('data-ai-go-engine', VERSION);
      root.setAttribute('data-ai-go-content', fingerprint(tree));
      if (inst.mode === 'preview') {
        root.insertBefore(el('p', 'aigo-banner', inst.issues.length
          ? fmt(inst.s.previewBanner, { n: inst.issues.length }) : inst.s.previewOk), root.firstChild);
      }
      /* In an iframe the parent decides the height, and a question can land
       * outside the visible area after a navigation. The height is posted; a
       * parent that does not listen loses nothing. It is the only thing this
       * engine ever sends anywhere, and it never leaves the browser. */
      postHeight();
    }
    function postHeight() {
      try {
        if (window.top === window.self) return;
        window.parent.postMessage({ aigo: 'height', px: document.documentElement.scrollHeight }, '*');
      } catch (e) {}
    }

    /* ------------------------------------------------------------- lifecycle */
    function onPop(ev) {
      var st = ev.state;
      if (!st || st.aigo !== historyTag) return;
      if (!restore(st.s)) resetToStart();
      render(false, true);
    }
    /* bfcache: coming back from another site restores the page as it was;
     * nothing else resynchronises the state. */
    function onShow(ev) { if (ev.persisted) { readSession(); render(false); } }

    if (inst.useHistory) window.addEventListener('popstate', onPop);
    window.addEventListener('pageshow', onShow);

    inst.answer = answer;
    inst.back = back;
    inst.restart = restart;
    inst.setLang = function (l) { setLang(l, false); };
    /* Interaction-time save. paint() pushes a snapshot when a view is drawn,
     * that is before any answer exists on it. Ticking a box must also update
     * the entry we are standing on, or Back restores a snapshot taken too early
     * and the boxes come back empty. Hooked on inst.save, never on save():
     * paint() calls save() before pushState, and a replaceState there would
     * overwrite the previous entry and shift the whole stack by one. */
    inst.save = function () {
      save();
      if (inst.useHistory) {
        try { history.replaceState({ aigo: historyTag, s: snapshot() }, ''); } catch (e) {}
      }
    };
    inst.getState = snapshot;
    inst.destroy = function () {
      if (inst.useHistory) window.removeEventListener('popstate', onPop);
      window.removeEventListener('pageshow', onShow);
      root.textContent = '';
      root.classList.remove('aigo');
    };
    Object.defineProperty(inst, 'node', { get: function () { return inst.result ? null : currentNode(inst); } });

    if (opt.resume !== false) readSession();
    render(false);
    if (inst.useHistory) {
      try { history.replaceState({ aigo: historyTag, s: snapshot() }, ''); } catch (e) {}
    }
    return inst;
  }

  /* ===========================================================================
   * 8. AUTO-MOUNT BY ATTRIBUTE
   *
   * Every container carrying data-ai-go is mounted once, reading data-lang,
   * data-history="false", data-storage="none", data-mode and
   * data-heading-level. Default language: the page language when the tree
   * declares it. On a page carrying TWO questionnaires, give
   * data-history="false" to all but one, or the browser's Back button pops the
   * entries of both.
   * ======================================================================== */

  function mountAll(scope) {
    if (typeof document === 'undefined') return [];
    var made = [];
    (scope || document).querySelectorAll('[data-ai-go]:not([data-ai-go-mounted])').forEach(function (root) {
      root.setAttribute('data-ai-go-mounted', '1');
      var name = root.getAttribute('data-ai-go');
      var tree = (typeof window !== 'undefined') ? window[name] : undefined;
      var docLang = (document.documentElement.lang || '').split('-')[0].toLowerCase();
      var lang = root.getAttribute('data-lang') || null;
      if (!isObject(tree)) {
        renderRefusal(root, [{ path: name, message: fmt(makeStrings(lang || docLang, null).notLoaded, { name: name }) }], lang || docLang);
        return;
      }
      if (!lang) lang = arr(tree.langs).indexOf(docLang) >= 0 ? docLang : (tree.defaultLang || arr(tree.langs)[0]);
      made.push(mount(root, tree, {
        lang: lang,
        history: root.getAttribute('data-history') !== 'false',
        /* undefined, not a key of our own: mount() derives the default and
         * hands out a distinct one per live instance. Computing it here gave
         * two containers of the same tree one shared session. */
        storageKey: root.getAttribute('data-storage') === 'none' ? null : undefined,
        mode: root.getAttribute('data-mode') || undefined,
        headingLevel: root.getAttribute('data-heading-level') || undefined
      }));
    });
    return made;
  }
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { mountAll(); });
    else setTimeout(function () { mountAll(); }, 0);
  }

  return {
    version: VERSION,
    UI: UI,
    POLICY: POLICY,
    mount: mount,
    mountAll: mountAll,
    structure: structure,
    guard: guard,
    fingerprint: fingerprint,
    hash: hash
  };
})();
</script>
