    return hit;
  }

  /* Date.parse accepts "2026-02-31" and rolls it over to 3 March. A review date
   * that does not exist is a typo, and a typo in a review date is exactly the
   * kind of thing a reader would trust. Only an exact round trip passes. */
  /* ONE FORMAT, AND NOTHING ELSE. The refusal sentence has always promised
   * YYYY-MM-DD; the check used to fall back on Date.parse for everything else,
   * and Date.parse reads "03.12.2026" -- the third of December as a Swiss
   * secretary writes it -- as the ELEVENTH OF MARCH. The file was declared
   * publishable, printed "Relu le 03.12.2026" under every result, and started
   * the eighteen-month review clock nine months early, with nobody told. A date
   * this file cannot read without guessing is a date it refuses, and the
   * sentence it refuses with names the format. */
  function isValidDate(value) {
    if (typeof value !== 'string') return false;
    /* The date, and the time of day if a tool wrote one. `2026-06-01` and
     * `2026-06-01T00:00:00Z` are the same day and neither is ambiguous, so
     * refusing the second punished whoever exported their date from a
     * spreadsheet -- with a T or with a space, both of which spreadsheets
     * write. `2026-6-1` is not one of them: a month on one digit is where the
     * reading starts to guess, and guessing is what this check exists to stop.
     * WHAT IS DRAWN IS THE DAY, never the time of day: the footer printed
     * "Relu le 2026-06-01T00:00:00Z" at readers who had asked for a date. */
    var v = String(value).trim().split(/[T ]/)[0];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
    var d = new Date(v + 'T00:00:00Z');
    /* Round trip, because Date rolls 2026-02-31 over to the third of March. */
    if (isNaN(d.getTime()) || d.toISOString().slice(0, 10) !== v) return false;
    /* AND IT HAS TO HAVE HAPPENED. A review dated in the future is a typing
     * slip -- 2062 for 2026 -- and the page then printed "reviewed on 2062" at
     * every reader, an untrue statement made in the institution's name, while
     * the eighteen-month banner never came due because the age was negative.
     * One day of slack for whoever publishes across a timezone. */
    return d.getTime() <= Date.now() + 86400000;
  }

  /* Read the same way, or the banner would be computed from a date the check
   * refused. */
  function reviewAgeDays(tree) {
    var v = tree && tree.review && tree.review.date;
    if (!isValidDate(v)) return null;
    var t = Date.parse(String(v).trim().split(/[T ]/)[0] + 'T00:00:00Z');
    return isNaN(t) ? null : Math.floor((Date.now() - t) / 86400000);
  }

  /* ===========================================================================
   * 5. CONTENT FINGERPRINT
   *
   * Two FNV-1a walks plus an avalanche, sixteen hexadecimal characters, over a
   * JSON projection of start, nodes, results and links. It was djb2 on
   * thirty-two bits until 3.0.19, where a collision was constructed on it.
   * Not normalised: keys are hashed in the order the file declares them, so
   * reordering an object moves the fingerprint even though nothing was said
   * differently. That is the safe direction to be wrong in. It answers one question in front of a data protection officer:
   * "are the questions and the routing still the ones we signed?". Its scope is
   * frozen: changing it would move every fingerprint ever recorded on a signed
   * sheet. It is printed under every result and on the container, so it can be
   * read on the page that is actually served, not only on a file someone
   * carries to the validator.
   *
   * A SECOND VALUE, BECAUSE THE FIRST ONE'S SCOPE MUST NOT MOVE. The fields the
   * projection above leaves out were said to be "printed in clear right beside
   * it", and printing is not signing: `derivedFrom` was measured to be added,
   * removed and renamed without the receipt moving by one character, and it is
   * the field that says whose questionnaire this is adapted from. Widening the
   * projection was the other way out and it was measured too: it would move the
   * recorded fingerprint of every tree that already declares one of those
   * fields, which is exactly the adopters, and it would fold two questions into
   * one number so that a legal service reading it could no longer tell which
   * half had changed. So the signature block gets a value of its own.
   * signature() covers publisher, review, disclaimer, derivedFrom, jurisdiction
   * and legalBasis; fingerprint() keeps its scope, to the character. Two values,
   * two questions: "are these still the questions we signed?" and "is this still
   * the same signature under them?".
   * ======================================================================== */

  /* SIXTEEN HEXADECIMAL CHARACTERS, AND A MIX THAT DOES NOT ADD UP. The first
   * version was one djb2 word, thirty-two bits, and an auditor produced two
   * contradictory trees with the same receipt in seconds. The second version
   * doubled the width with a second djb2-shaped walk, and an auditor produced a
   * collision for BOTH halves at once with twelve ASCII characters: two walks
   * that are each linear in the character values are one walk, however many
   * words you print. So neither half is linear any more. Each is FNV-1a, which
   * mixes by xor and multiply rather than by adding, seeded differently and fed
   * the position as well as the character, and each is avalanched at the end so
   * that one bit of input moves half the bits of output.
   *
   * This is not a cryptographic digest and does not claim to be: it detects a
   * changed questionnaire, and it costs a forger real work rather than a lucky
   * afternoon. A dependency-free file cannot carry SHA-256, and the SHA-256 of
   * the FILE is in docs/PUBLICATIONS.md for whoever needs that instead. */
  function mul32(a, b) {
    var al = a & 0xffff, ah = a >>> 16;
    return (((al * b) + (((ah * b) & 0xffff) << 16)) | 0);
  }
  function avalanche(h) {
    h = h ^ (h >>> 16); h = mul32(h, 0x85ebca6b);
    h = h ^ (h >>> 13); h = mul32(h, 0xc2b2ae35);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function hash(src) {
    var s = String(src), a = 0x811c9dc5, b = 0x9e3779b9, i, c;
    for (i = 0; i < s.length; i++) {
      c = s.charCodeAt(i);
      a = mul32(a ^ c, 16777619);
      b = mul32(b ^ (c + i), 2246822519);
      b = (b << 13) | (b >>> 19);
    }
    return ('00000000' + avalanche(a).toString(16)).slice(-8) +
           ('00000000' + avalanche(b).toString(16)).slice(-8);
  }
  /* Never throws: check.html calls it on whatever file was dropped on it. */
  /* CE QUI EST SIGNE EST CE QUI EST AFFICHE, et c'est la copie gelee qui est
   * affichee. Les trois projections lisaient l'objet qu'on leur passait : une
   * cle posee non enumerable disparaissait de la serialisation sans disparaitre
   * de l'ecran, si bien que deux fichiers montrant deux editeurs et deux
   * conclusions differentes rendaient le meme recu, et que le recu de
   * `check.html` differait de celui du moteur sur le meme fichier. Le gel rend
   * propres et enumerables les valeurs qu'il copie : passer par lui, c'est
   * signer la page. */
  function frozenFor(tree) {
    var fz = freezeTree(tree);
    return isObject(fz.value) ? fz.value : {};
  }
  function fingerprint(tree) {
    var t = frozenFor(tree);
    try { return hash(JSON.stringify({ s: t.start, n: t.nodes, r: t.results, l: t.links })); }
    catch (e) { return '????????????????'; }   /* self-referential: nothing to sign */
  }
  /* THE READING MATTER ALONE: the questions, the answers, the results. Not the
   * links, which point outside the reading and which an adopter must replace in
   * any case -- see POLICY.example for what including them cost. Used for one
   * thing, recognising the delivered example, and deliberately not merged with
   * the receipt above, which signs a different question. */
  function examplePrint(tree) {
    var t = frozenFor(tree);
    try { return hash(JSON.stringify({ s: t.start, n: t.nodes, r: t.results })); }
    catch (e) { return '????????????????'; }
  }
  /* WHO ANSWERS FOR THIS TREE, as one value. Same mixing, same "never throws", and
   * deliberately NOT merged into the one above. Written out key by key rather
   * than as "everything fingerprint() leaves out", so that adding a field to a
   * tree never silently moves a value a legal service has already recorded: a
   * new field is a line in this projection or it is not signed, and either way
   * somebody had to decide. */
  function signature(tree) {
    var t = frozenFor(tree);
    try {
      /* EVERYTHING THE READER SEES THAT THE FINGERPRINT DOES NOT SIGN. The
       * fingerprint covers the start, the questions, the results and the links -- the same
       * words every page of this repository uses for it, because four different
       * wordings for one calculation is four chances to be wrong. This
       * covers the rest of what is drawn: who publishes, when it was reviewed,
       * the disclaimer, the attribution, the law it names, the STEP NAMES under
       * the progress bar, and the INTERFACE LABELS. The last two were outside
       * both, so a copy renamed its steps to "No personal data / Free use /
       * Publication allowed" and its Continue button to "Publish unchecked",
       * and handed over a receipt identical to the original's, character for
       * character. `id`, `version` and the language declarations go in too:
       * they are what the file calls itself. */
      return hash(JSON.stringify({ p: t.publisher, r: t.review, x: t.disclaimer,
        d: t.derivedFrom, j: t.jurisdiction, b: t.legalBasis,
        s: t.steps, u: t.ui, i: t.id, v: t.version,
        l: t.langs, dl: t.defaultLang }));
    } catch (e) { return '????????????????'; }
  }

  /* ===========================================================================
   * 6. VIEWS
   *
   * Rendering functions: they read the instance state and append DOM nodes to
   * `host`, and they never look outside the instance root. Not pure: the
   * handlers they attach record the answer and ask the instance to save, which
   * is the whole point of a question. Each returns the element that should
   * receive focus after a navigation.
   * ======================================================================== */

  var groupSeq = 0;   // radio group names must be unique per rendering, even across instances

  /* English base, overridden by the shipped label set for the language, then by
   * the tree's own `ui`. A language the engine does not know is served entirely
   * by the tree. */
  function makeStrings(lang, tree) {
    var s = {};
    Object.keys(UI.en).forEach(function (k) { s[k] = UI.en[k]; });
    /* LE CODE EXACT D'ABORD, SON CODE PRIMAIRE ENSUITE. « fr-CH » ne se trouvait
     * dans aucune table, et le moteur servait ses trente et un libelles en
     * anglais sous des questions restees francaises : la page parlait deux
     * langues a la fois. Declarer ui['fr-CH'] reste possible et l'emporte. */
    var base = String(lang == null ? '' : lang).split(/[-_]/)[0].toLowerCase();
    var shipped = lang === 'en' || base === 'en' ? null : (UI[lang] || UI[base]);
    if (shipped) overlay(s, shipped, false);
    var custom = isObject(tree && tree.ui) ? (tree.ui[lang] || tree.ui[base]) : null;
    if (custom) overlay(s, custom, true);
    return s;
  }
  /* `msg` is the one label whose value is an object, so it is merged key by key
   * rather than replaced: a tree that rewords one refusal keeps the other
   * forty-one. `known` is what stops a tree from adding keys nothing reads, and
   * the line below stops it from emptying one it is allowed to reword. */
  function overlay(s, from, known) {
    Object.keys(from).forEach(function (k) {
      if (known && !own(s, k)) return;
      /* ET LA VALEUR AUSSI, PAS SEULEMENT LA CLE. Une etiquette posee a la
       * chaine vide, a null, a un nombre ou a un tableau vidait le bouton que
       * le lecteur doit cliquer, et le verdict disait « publiable ». Le repli
       * du moteur vaut mieux qu'un bouton sans nom. `msg` n'est pas une
       * chaine et n'est donc pas concerne. */
      if (known && typeof s[k] === 'string' && !solid(from[k])) return;
      if (!isObject(s[k]) || !isObject(from[k])) { s[k] = from[k]; return; }
      var merged = {};
      Object.keys(s[k]).forEach(function (m) { merged[m] = s[k][m]; });
      Object.keys(from[k]).forEach(function (m) {
        if (own(merged, m) && typeof from[k][m] === 'string') merged[m] = from[k][m];
      });
      s[k] = merged;
    });
  }

  function text(inst, value) { return pickLang(value, inst.lang, inst.fallbacks); }
  function currentNode(inst) { return inst.path[inst.path.length - 1]; }

  function button(cls, label, onClick) {
    var b = el('button', 'aigo-btn ' + cls, label);
    b.type = 'button';   // never a submit button: the host page may be a CMS form
    b.addEventListener('click', onClick);
    return b;
  }
  /* Back appears as soon as there is something to go back to. */
  function renderButtons(inst, primaryLabel, onPrimary) {
    var row = el('div', 'aigo-buttons');
    if (inst.path.length > 1 || inst.result) row.appendChild(button('aigo-btn-ghost', inst.s.back, inst.back));
    row.appendChild(button('aigo-btn-primary', primaryLabel, onPrimary));
    return row;
  }

  /* Progress header. Returns the step label ("Step 2 of 10"), used by the live
   * announcement, or null when the tree declares no steps. */
  function renderProgress(inst, host) {
    var tree = inst.tree, s = inst.s;
    var steps = arr(tree.steps);
    if (!steps.length) return null;
    var node = inst.result ? null : tree.nodes[currentNode(inst)];
    var curIndex = -1;
    steps.forEach(function (st, i) { if (node && st && st.id === node.step) curIndex = i; });

    /* Steps actually visited come from the path, not from numbering. Skipped
     * steps stay visibly skipped: that is information about the reasoning. */
    var visited = Object.create(null);
    inst.path.forEach(function (id) { if (own(tree.nodes, id)) visited[tree.nodes[id].step] = true; });

    var label = inst.result
      ? s.resultLabel
      : fmt(s.stepOf, { n: (curIndex + 1) + (node && node.stepSuffix ? node.stepSuffix : ''), total: steps.length });
    var meta = el('div', 'aigo-progress-meta');
    meta.appendChild(el('span', 'aigo-eyebrow', s.progressLabel));
    meta.appendChild(el('span', 'aigo-progress-text', label));
    host.appendChild(meta);

    /* Decorative: the information is carried by the label above and by the live
     * region. A screen reader has no reason to cross ten dots. */
    var bar = el('div', 'aigo-steps');
    bar.setAttribute('aria-hidden', 'true');
    steps.forEach(function (st, i) {
      var state = 'todo';
      if (!inst.result && i === curIndex) state = 'current';
      else if (st && visited[st.id] === true && (inst.result || i !== curIndex)) state = 'done';
      else if (inst.result || i < curIndex) state = 'skipped';
      bar.appendChild(el('span', 'aigo-step aigo-step-' + state));
    });
    host.appendChild(bar);

    if (!inst.result && curIndex >= 0) host.appendChild(elText('p', 'aigo-step-name', text(inst, steps[curIndex].name)));
    return label;
  }

  function renderQuestion(inst, host) {
    var id = currentNode(inst);
    var node = inst.tree.nodes[id];
    var view = el('section', 'aigo-question');
    var title = elText('h' + inst.headingLevel, 'aigo-title', text(inst, node.title));
    title.setAttribute('tabindex', '-1');
    view.appendChild(title);
    if (node.help) {
      var help = el('div', 'aigo-help');
      renderText(help, node.help, inst.lang, inst.fallbacks);
      view.appendChild(help);
    }
    if (node.type === 'multi') renderMulti(inst, view, id, node); else renderSingle(inst, view, id, node);
    host.appendChild(view);
    return title;
  }

  /* Checkbox question. Ticking only records the answer; Continue routes. */
  function renderMulti(inst, view, id, node) {
    /* fieldset/legend: tabbing through the boxes re-announces the question.
     * Without it one hears "Health" without knowing which question. */
    var fs = el('fieldset', 'aigo-fieldset');
    fs.appendChild(elText('legend', 'aigo-sr-only', text(inst, node.title)));
    /* WHAT THE BOXES SHOW, and nothing else: the values this question offers,
     * each of them once. A duplicate showed one ticked box and survived the
     * unticking of it; a value the tree no longer offers showed no box at all.
     * Both stayed in the recorded answer, and both then routed the reader. */
    var checked = offeredOf(node, inst.answers[id]);
    arr(node.options).forEach(function (o) {
      var lab = el('label', 'aigo-check');
      var input = document.createElement('input');
      input.type = 'checkbox';
      input.value = o.value;
      input.checked = checked.indexOf(o.value) >= 0;
      input.addEventListener('change', function () {
        /* Rebuilt, never patched. splice() took out ONE occurrence, so a value
         * present twice survived its own box being unticked. */
        checked = checked.filter(function (x) { return x !== o.value; });
        if (input.checked) checked.push(o.value);
        inst.answers[id] = checked.slice();
        inst.save();
      });
      lab.appendChild(input);
      var span = el('span');
      inlineInto(span, text(inst, o.label));
      lab.appendChild(span);
      fs.appendChild(lab);
    });
    view.appendChild(fs);
    inst.answers[id] = checked;
    /* Routes on the BOXES, not on inst.answers: `checked` is the list the boxes
     * themselves maintain, so what Continue sends is what the reader can see. */
    view.appendChild(renderButtons(inst, inst.s.continue, function () { inst.answer(id, checked.slice()); }));
  }

  /* Radio question. The `change` event only records the answer. Navigation
   * happens on Continue, or on a MOUSE click: arrow keys also fire `click`
   * (with detail 0), and reading the "No" option must never propel the reader
   * into the next question. */
  function renderSingle(inst, view, id, node) {
    var s = inst.s;
    /* fieldset/legend, exactly as renderMulti: without it a screen reader
     * announces "Yes" with no idea which question it answers. */
    var fs = el('fieldset', 'aigo-fieldset');
    fs.appendChild(elText('legend', 'aigo-sr-only', text(inst, node.title)));
    var group = el('div', 'aigo-options');
    var name = 'aigo-' + (++groupSeq) + '-' + id;
    var chosen = typeof inst.answers[id] === 'string' ? inst.answers[id] : null;
    arr(node.answers).forEach(function (a) {
      var lab = el('label', 'aigo-option');
      var input = document.createElement('input');
      input.type = 'radio';
      input.name = name;
      input.value = a.value;
      input.checked = chosen === a.value;
      input.addEventListener('change', function () { inst.answers[id] = a.value; inst.save(); });
      input.addEventListener('click', function (ev) {
        if (ev.detail === 0) return;
        inst.answers[id] = a.value;
        inst.answer(id, a.value);
      });
      lab.appendChild(input);
      var wrap = el('span', 'aigo-option-text');
      wrap.appendChild(elText('span', 'aigo-option-label', text(inst, a.label) || s[a.value] || a.value));
      if (a.detail) {
        var det = el('span', 'aigo-option-detail');
        inlineInto(det, text(inst, a.detail));
        wrap.appendChild(det);
      }
      lab.appendChild(wrap);
      group.appendChild(lab);
    });
    fs.appendChild(group);
    view.appendChild(fs);
    view.appendChild(renderButtons(inst, s.continue, function () {
      var v = inst.answers[id];
      if (typeof v !== 'string') {
        /* Nothing chosen. Moving the focus is not enough: a screen reader user
         * hears nothing and cannot tell that the click was refused. */
        var first = view.querySelector('input');
        if (first) first.focus();
        /* ET SOUS LES YEUX AUSSI. Le deplacement du focus ne se voit pas apres un
         * clic de souris -- la feuille ne peint que :focus-visible -- et le
         * message ne vivait que dans la region annoncee. L'ecran ne bougeait
         * donc pas d'un caractere, et le bouton passait pour casse. Pose une
         * seule fois : un second clic ne l'empile pas, et la navigation
         * suivante vide la vue. */
        var msg = view.querySelector('.aigo-choose');
        if (!msg) { msg = elText('p', 'aigo-choose', s.chooseOne); view.appendChild(msg); }
        /* ET AMENE SOUS LES YEUX. A 200 % de zoom, cible du critere 1.4.4, le
         * message naissait sous le pli et l'ecran ne bougeait pas d'un pixel :
         * le correctif tenait a la lettre et ratait son but. Un navigateur qui
         * ne connait pas scrollIntoView ne perd rien, le message est ecrit. */
        try { if (msg.scrollIntoView) msg.scrollIntoView({ block: 'nearest' }); } catch (e) {}
        inst.announce(s.chooseOne);
        return;
      }
      inst.answer(id, v);
    }));
  }

  /* A link whose host is not one of the publisher's domains is shown WITH that
   * host next to its label. An institution that adapted a tree and left a link
   * to the source behind cannot hide it from its own readers, and neither can
   * the institution that copies that adaptation in turn. */
  function renderLink(inst, linkId) {
    var link = inst.tree.links[linkId];
    var li = el('li');
    var a = el('a', 'aigo-link');
    /* Texts are safe by construction (no innerHTML); a URL is not, since a
     * script scheme runs on click. Scheme allow-list; anything else is inert. */
    a.href = safeHref(link.href) || '#';
    inlineInto(a, text(inst, link.label));
    if (link.external) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.appendChild(el('span', 'aigo-sr-only', ' ' + inst.s.newTab));
    }
    li.appendChild(a);
    var host = hostOf(link.href);
    var owned = arr(inst.tree.publisher && inst.tree.publisher.domains);
    if (host && !owned.some(function (d) { return endsWithDomain(host, d); })) {
      li.appendChild(el('span', 'aigo-foreign-host', ' (' + host + ')'));
    }
    return li;
  }

  function renderResult(inst, host) {
    var tree = inst.tree, s = inst.s;
    var r = tree.results[inst.result];
    var view = el('section', 'aigo-result');

    var banner = el('div', 'aigo-alert aigo-alert-' + (r.level || 'info'));
    /* A heading, not a <strong>: the verdict is what a screen reader user jumps
     * to, and heading navigation is how they jump. */
    var head = elText('h' + inst.headingLevel, 'aigo-result-title', text(inst, r.title));
    head.setAttribute('tabindex', '-1');
    banner.appendChild(head);
    if (r.summary) renderText(banner, r.summary, inst.lang, inst.fallbacks);
    view.appendChild(banner);

    if (r.solution) {
      var sol = el('div', 'aigo-solution');
      /* label: "plain" (default) | "legal" | a text of the tree's own. */
      var label = r.solution.label === 'legal' ? s.solutionLabelLegal
                : (!r.solution.label || r.solution.label === 'plain') ? s.solutionLabel
                : text(inst, r.solution.label);
      sol.appendChild(el('div', 'aigo-solution-label', label));
      var solText = el('div', 'aigo-solution-text');
      inlineInto(solText, text(inst, r.solution.text));
      sol.appendChild(solText);
      view.appendChild(sol);
    }

    if (arr(r.allowed).length) view.appendChild(renderBlock(s.allowedLabel, arr(r.allowed).map(function (id) {
      return own(tree.links, id) ? renderLink(inst, id) : null;
    })));
    if (arr(r.forbidden).length) view.appendChild(renderBlock(s.forbiddenLabel, arr(r.forbidden).map(function (t) {
      var li = el('li');
      inlineInto(li, text(inst, t));
      return li;
    })));

    if (r.alert) {
      var alert = el('div', 'aigo-alert aigo-alert-' + (r.alert.level || 'info'));
      renderText(alert, r.alert.text, inst.lang, inst.fallbacks);
      view.appendChild(alert);
    }

    view.appendChild(renderButtons(inst, s.restart, function () { inst.restart(); }));

    if (tree.disclaimer) {
      var disc = el('div', 'aigo-alert aigo-alert-info aigo-disclaimer');
      renderText(disc, tree.disclaimer, inst.lang, inst.fallbacks);
      view.appendChild(disc);
    }
    view.appendChild(renderFooter(inst));
    host.appendChild(view);
    return head;
  }

  function renderBlock(title, items) {
    var block = el('div', 'aigo-block');
    block.appendChild(el('div', 'aigo-block-title', title));
    var ul = el('ul', 'aigo-list');
    /* LA LISTE PORTE LE NOM DE SON BLOC. « autorise » et « interdit » arrivaient
     * toutes deux comme « liste, 3 elements » : la seule chose qui les
     * distingue est au-dessus, et une navigation par listes ne la lit pas.
     * aria-label et non aria-labelledby : le moteur s'interdit les identifiants
     * globaux, et deux instances coexistent sur une page. */
    ul.setAttribute('aria-label', title);
    items.forEach(function (li) { if (li) ul.appendChild(li); });
    block.appendChild(ul);
    return block;
  }

  /* Publisher, review date, attribution and the content fingerprint. The
   * review date is INTERFACE information: it tells the reader whether the
   * recommendation they just received is six months or six years old. */
  function renderFooter(inst) {
    var tree = inst.tree, s = inst.s;
    var foot = el('div', 'aigo-review');
    if (tree.review && tree.review.date) {
      var signed = tree.publisher && tree.publisher.name ? tree.publisher.name + ' · ' : '';
      /* Le jour, jamais l'heure : la forme horodatée d'un tableur est acceptée
       * en entrée, et « Relu le 2026-06-01T00:00:00Z » n'est pas une date qu'on
       * montre à qui en demandait une. */
      var reviewDay = String(tree.review.date || '').trim().split(/[T ]/)[0];
      foot.appendChild(el('p', null, signed + fmt(s.reviewedOn, { date: reviewDay, by: tree.review.by || '?' })));
      var age = reviewAgeDays(tree);
      if (age !== null && age > POLICY.reviewMaxDays) foot.appendChild(el('p', 'aigo-review-expired', fmt(s.expiredReview, { days: POLICY.reviewMaxDays })));
    }
    /* derivedFrom: "Name" or { name, url }. The attribution names the source and
     * says it has not reviewed the adaptation. It is not a lock: it is the
     * disclosure an honest adopter makes, and the README asks for it in as many
     * words. */
    var source = tree.derivedFrom && (typeof tree.derivedFrom === 'string' ? tree.derivedFrom : tree.derivedFrom.name);
    /* Not optional. Declaring derivedFrom buys the exemption that lets a copy
     * name its source; the sentence saying the source has not reviewed it is the
     * other half of that bargain, and it used to be switchable off. */
    /* NOT the tree's wording. `derivedFrom` buys the right to name the origin,
     * and the price is this sentence: adapted from, not reviewed by, not
     * answerable for. It was an overridable interface label, so a copy wrote
     * "Questionnaire validated and certified by {source}" and bought an
     * endorsement instead, or wrote a single space and bought silence, and the
     * receipt moved in neither case. The engine says this one, in the language
     * of the page, and the tree does not get a say. */
    if (source) {
      /* THE LICENCE NOTICE IS OURS TO WRITE, not the adopter's. A CC BY notice
       * names the creator, the work, the licence and the fact of adaptation, and
       * every one of those names the origin -- so leaving it to the adopter's
       * prose meant either exempting that prose from the lock, or refusing the
       * adopter the means of complying. The engine writes it, out of three
       * fields that hold no sentences: `name`, `url`, `licence`. What the tree
       * supplies is filled in; the wording around it is never the tree's. */
      var derived = isObject(tree.derivedFrom) ? tree.derivedFrom : {};
      var srcUrl = typeof derived.url === 'string' ? derived.url : '';
      var srcLic = typeof derived.licence === 'string' ? derived.licence : '';
      var table = UI[inst && inst.lang] && UI[inst.lang].attribution ? UI[inst.lang] : UI.en;
      var creditWords = srcUrl && srcLic ? table.attributionBoth
        : srcUrl ? table.attributionUrl
        : srcLic ? table.attributionLicence
        : table.attribution;
      /* DESSINEE TELLE QUELLE, sans lire la syntaxe en ligne. Cette phrase est
       * composee de trois VALEURS et de mots qui sont les nôtres : rien n'y est
       * du texte à mettre en forme. Et le nom y figure deux fois, si bien qu'un
       * seul `**` dans le nom en faisait deux dans la phrase, la parité devenait
       * paire, et « Formule 2**8 SA » se lisait « Formule 28 SA » -- le nom de la
       * source altéré dans la phrase même qui prétend le nommer. */
      foot.appendChild(el('p', 'aigo-attribution',
        fmt(creditWords, { source: source, url: srcUrl, licence: srcLic })));
    }
    /* And the adopter's own sentence about that source, when there is one. It
     * comes AFTER the engine's, never instead of it: the disclosure that the
     * source has not reviewed the adaptation is the half of the bargain the
     * adopter does not get to word. */
    if (source && isObject(tree.derivedFrom) && tree.derivedFrom.note != null) {
      var note = el('div', 'aigo-attribution');
      renderText(note, tree.derivedFrom.note, inst.lang, inst.fallbacks);
      foot.appendChild(note);
    }
    foot.appendChild(el('p', 'aigo-content-id', fmt(s.contentId, { hash: fingerprint(tree), version: VERSION })));
    /* The signature value, on its own line and after the content one, so the
     * assertion that reads "the first content-id line" still reads the content
     * fingerprint. Same treatment as the preview banner: a tree that overrides
     * this label with nothing at all does not get to blank the value, because a
     * label the content can empty is a label the content can remove. */
    var sigWords = solid(s.signatureId) ? s.signatureId : UI.en.signatureId;
    foot.appendChild(el('p', 'aigo-content-id', fmt(sigWords, { hash: signature(tree) })));
    return foot;
  }

  /* THE POINTS TO FIX, as a list, in ONE place. The strict refusal box drew this
   * list and the local preview drew only a count of it, so a file opened by
   * double-click said "1 item to complete" and never which, and the only way to
   * learn the name of the field was to carry the file to check.html. Whoever
   * opens the file that way is precisely the person who does not program. One
   * function, read by both, so the two can no longer say different things. */
  function issueList(issues, s) {
    var ul = el('ul', 'aigo-issues');
    issues.forEach(function (i) {
      var li = el('li');
      li.appendChild(el('code', null, i.path));
      /* The colon of the LANGUAGE, not a colon typed here. Punctuation is a
       * property of a language, the engine already holds the French one in
       * `colon`, and this box was the one place that wrote its own: a French
       * refusal box read "publisher.name: Qui publie ?" with the space of
       * English in front of the colon and the sentence of French after it. */
      li.appendChild(document.createTextNode(s.colon + i.message));
      ul.appendChild(li);
    });
    return ul;
  }

  /* Refusal box: the only thing displayed when content is not publishable. */
  /* LE NIVEAU DE TITRE ET L'ARBRE, tous deux declares par l'adoptante et tous
   * deux ignores ici. Le titre etait un h2 en dur sous un data-heading-level
   * qui disait autre chose ; et quatre phrases d'interface que le validateur
   * exige d'une traduction n'etaient jamais lues, puisque cette boite lisait
   * toujours la table livree. `tree` n'arrive QUE gele : a l'appel ou le gel a
   * echoue, lire l'arbre brut rendrait au garde ce qu'il refuse de lire. */
  function renderRefusal(root, issues, lang, tree, level) {
    var s = makeStrings(lang || 'en', isObject(tree) ? tree : null);
    var hn = 'h' + Math.min(6, Math.max(1, parseInt(level, 10) || 2));
    root.textContent = '';
    var box = el('div', 'aigo aigo-error');
    box.setAttribute('role', 'alert');
    /* LA LANGUE, DITE. Cet encadre est parfois la seule chose que la page
     * affiche, et il ne portait aucun attribut de langue : une synthese vocale
     * anglaise y prononcait du francais, ou l'inverse. */
    if (lang) box.setAttribute('lang', lang);
    /* UN TITRE, PAS UN GRAS. Qui navigue de titre en titre ne trouvait rien sur
     * la seule page qu'il ait a lire. */
    var refusalHead = el(hn, null, s.notPublished);
    refusalHead.setAttribute('tabindex', '-1');
    box.appendChild(refusalHead);
    box.appendChild(el('p', null, s.notPublishedLead));
    box.appendChild(issueList(issues, s));
    root.appendChild(box);
  }

  /* ===========================================================================
   * 7. THE INSTANCE
   *
   * mount(root, tree, options) returns the instance, or null when the tree is
   * refused (the refusal is rendered in `root`). Options:
   *   lang          interface and content language (default: tree.defaultLang)
   *   storageKey    sessionStorage key, null to disable (default: "aigo:" + id)
   *   history       push one browser history entry per step (default: true)
   *   headingLevel  1..6, the heading level of question titles (default: 2)
   *   mode          "strict" (default off localhost) refuses non-publishable
   *                 content; "preview" displays it with a banner
   *   resume        restore a saved session if any (default: true)
   * ======================================================================== */

  /* Keys held by live instances, so that a second mount takes its own. */
  var liveKeys = Object.create(null);
  function claimKey(base) {
    var k = base, i = 1;
    while (liveKeys[k]) k = base + '#' + (++i);
    liveKeys[k] = true;
    return k;
  }
  function mount(root, tree, options) {
    if (!root) throw new Error('AI_GO.mount: missing container.');
    var opt = options || {};
    /* FROZEN FIRST, AND ONCE. Everything below reads this copy: the checks, the
     * views, the footer, the session. The argument is never read again, so the
     * tree that was judged and the tree that is drawn cannot be two things. */
    var fz = freezeTree(tree);
    var frozen = fz.value;
    var lang = opt.lang || (frozen && frozen.defaultLang) || (frozen && arr(frozen.langs)[0]) || 'en';
    /* QUI NOMME UNE LANGUE L'A DECLAREE. Le montage automatique calcule ce
     * drapeau lui-meme, a partir de data-lang et de la langue du document ; un
     * appel direct a AI_GO.mount() ne le passe pas -- et la session laissee par
     * une autre page decidait alors de la langue de celle-ci, sous son propre
     * grand titre. Passer `lang`, c'est declarer une langue. */
    var langDeclared = opt.langDeclared === true ||
      (opt.langDeclared === undefined && typeof opt.lang === 'string' && opt.lang !== '');

    /* A missing tree is the most common failure: a forgotten comma in the
     * content block, and the script never defined the variable. A tree that
     * could not be frozen is a different thing and gets the refusal list, not
     * this sentence: something IS there, and it is not data. */
    if (!isObject(tree) || (frozen && (!frozen.nodes || !frozen.start))) {
      root.textContent = '';
      /* LA MEME BOITE QUE SA JUMELLE, ET POUR LES MEMES RAISONS. Celle-ci
       * n'avait ni role, ni langue, ni titre navigable : elle est pourtant la
       * seule chose que la page affiche quand elle parait. La phrase loadError
       * devient le titre au lieu d'un paragraphe, donc aucune phrase nouvelle. */
      var box = el('div', 'aigo aigo-error');
      box.setAttribute('role', 'alert');
      if (lang) box.setAttribute('lang', lang);
      var loadHead = el('h2', null, makeStrings(lang, null).loadError);
      loadHead.setAttribute('tabindex', '-1');
      box.appendChild(loadHead);
      root.appendChild(box);
      return null;
    }

    var hostname = (typeof location !== 'undefined' && location.hostname) || '';
    /* An empty hostname means a page opened by double-click (file:), but also
     * an about:srcdoc or blob: frame inside a real site: only file: previews. */
    var protocol = (typeof location !== 'undefined' && location.protocol) || 'file:';
    var local = hostname ? isLocalHost(hostname) : protocol === 'file:';
    /* PREVIEW IS A LOCAL THING, and asking for it from a served page changes
     * nothing. data-mode="preview" used to disarm the guard wherever it was
     * written: the engine found its points to refuse and displayed the page all
     * the same, with a banner the copier's own stylesheet could hide and whose
     * words the tree could rewrite to nothing. A control the content can switch
     * off is not a control. Off a local machine there is one mode. */
    var mode = local ? (opt.mode === 'strict' ? 'strict' : 'preview') : 'strict';
    var issues;
    try {
      /* Naming the local host rather than passing "" keeps the origin exemption
       * for a file:// preview without granting it to an unknown host, such as an
       * about:srcdoc frame inside someone else's site. */
      issues = frozen === null ? [] : structure(frozen).concat(guard(frozen, local ? 'localhost' : hostname));
    } catch (e) { issues = [{ path: 'guard', message: phrase('renderFailed', { error: e && e.message }, msgsFor(frozen)) }]; }
    if (frozen === null) {
      /* Not displayable in any mode: what would be drawn is what could not be
       * read, and a preview of that is a preview of nothing. */
      renderRefusal(root, structure(tree), lang, null, opt.headingLevel);
      return null;
    }
    tree = frozen;
    if (issues.length && mode !== 'preview') {
      renderRefusal(root, issues, lang, frozen, opt.headingLevel);
      return null;
    }

    /* Two containers carrying the same tree are two questionnaires, not one:
     * sharing a key would make the second resume the first one's answers, and a
     * single browser Back would move both. */
    var defaultKey = claimKey('aigo:' + (tree.id || 'tree'));
    /* UNE FOIS, ET UNE SEULE. destroy() rend la cle que claimKey a reservee ;
     * appele deux fois il la rendait a nouveau, et la reservation suivante
     * retombait sur celle d'une instance VIVANTE. Deux questionnaires sur une
     * seule session, et l'un montrant a son lecteur la branche juridique de
     * l'autre : c'est le prix d'une liberation sans garde. */
    var dead = false;
    var inst = {
      root: root, tree: tree, issues: issues, mode: mode, lang: lang,
      s: makeStrings(lang, tree),
      fallbacks: fallbackLangs(tree),
      storageKey: opt.storageKey === null ? null : (opt.storageKey || defaultKey),
      useHistory: opt.history !== false,
      headingLevel: Math.min(6, Math.max(1, parseInt(opt.headingLevel, 10) || 2)),
      path: [tree.start],
      answers: Object.create(null),
      result: null,
      live: el('div', 'aigo-sr-only'),   // the live region, created once and re-attached at every render
      historyDepth: 0                    // entries this instance pushed; Back lets the browser pop them
    };
    inst.live.setAttribute('role', 'status');
    inst.live.setAttribute('aria-live', 'polite');
    /* History entries are tagged so that two instances on one page only react
     * to their own entries. */
    var historyTag = inst.storageKey || defaultKey;

    /* ---------------------------------------------------------- persistence
     * sessionStorage only, never localStorage: keeping "this person declares
     * handling health data" between two visits, in a tool whose subject IS data
     * protection, would be indefensible. Answers live in the session and in the
     * tab's history stack, and die with the tab. */
    /* A COPY, answers included. `path` was copied and `answers` was handed out
     * by reference, so getState() gave a host page the engine's own answer map:
     * writing one key of it moved the reader to another branch, and the next
     * save wrote that to the session. A state read is a read. */
    function snapshot() {
      var answers = Object.create(null);
      Object.keys(inst.answers).forEach(function (k) {
        var v = inst.answers[k];
        answers[k] = Array.isArray(v) ? v.slice() : v;
      });
      return { path: inst.path.slice(), answers: answers, result: inst.result, tv: tree.version, lang: inst.lang };
    }
    function save() {
      if (!inst.storageKey) return;
      try { sessionStorage.setItem(inst.storageKey + ':state', JSON.stringify(snapshot())); } catch (e) {}
    }
    function readSession() {
      if (!inst.storageKey) return false;
      try {
        var raw = sessionStorage.getItem(inst.storageKey + ':state');
        return raw ? restore(JSON.parse(raw)) : false;
      } catch (e) { return false; }
    }
    /* A tab opened before a redeployment may reference a removed node or an
     * older tree version. Restoring blindly would leave a blank area with no
     * way out: the state is rejected and the reader is told. */
    function restore(state) {
      if (!state || !Array.isArray(state.path) || !state.path.length) return false;
      var sameVersion = state.tv === undefined || tree.version === undefined || state.tv === tree.version;
      var known = state.path.every(function (id) { return own(tree.nodes, id); });
      var okResult = !state.result || own(tree.results, state.result);
      if (!sameVersion || !known || !okResult) { announce(inst.s.staleError); return false; }
      /* Built aside and committed only if it holds. Assigning first and checking
       * afterwards left the rejected state in place, and the caller rendered it:
       * the forged verdict was refused and displayed all the same. */
      var path = state.path.slice();
      /* A session written before an option was renamed, or edited by hand, can
       * hold values the tree no longer offers. They showed no ticked box and yet
       * routed as though one were ticked. Keep only what the tree still offers. */
      var answers = Object.create(null);
      var saved = isObject(state.answers) ? state.answers : {};
      Object.keys(saved).forEach(function (id) {
        if (!own(tree.nodes, id)) return;
        var node = tree.nodes[id], v = saved[id];
        if (node.type === 'multi') {
          if (!Array.isArray(v)) return;
          /* Filtered AND deduplicated, through the same offeredOf() the view
           * and the routing read. The ticked boxes are a set, but they are held
           * as a list, and unticking a box removes ONE occurrence of its value:
           * a session holding the same value twice left a copy behind that no
           * box on screen shows and that routes as "at least one ticked". A
           * wrong legal branch with no ticked box in front of it, which is the
           * one failure this whole tool exists to avoid. */
          answers[id] = offeredOf(node, v);
        } else if (arr(node.answers).some(function (a) { return a && a.value === v; })) {
          answers[id] = v;
        }
      });
      var result = state.result || null;
      /* A session is a hint, not an authority. Replayed from the start with the
       * answers it carries, it must land exactly where it claims: a stored state
       * used to display any verdict at all, whatever had been answered. */
      var claimed = path[path.length - 1];
      var walk = tree.start, hops = 0, reached = null, route = [];
      while (own(tree.nodes, walk) && hops++ < 200) {
        route.push(walk);
        /* Standing on a question, the replay stops there: the answer stored for
         * it is the ticked box waiting to be shown again, not a step taken. */
        if (!result && walk === claimed) break;
        var v = answers[walk];
        if (v === undefined) break;
        var hop = nextFrom(walk, v);
        if (hop.result) { reached = hop.result; walk = null; break; }
        if (!hop.to || !own(tree.nodes, hop.to)) break;
        walk = hop.to;
      }
      /* And the path has to BE that route, question for question. Comparing
       * only the verdict let a session skip a question, or invent one, and
       * still be restored: the reader then walked Back into a question the
       * answers had never gone through. */
      if ((result ? result !== reached : walk !== claimed) ||
          route.length !== path.length ||
          route.some(function (id, i) { return id !== path[i]; })) {
        announce(inst.s.staleError);
        return false;
      }
      inst.path = path;
      inst.answers = answers;
      inst.result = result;
      /* LA SESSION NE CHOISIT PAS LA LANGUE D'UNE AUTRE PAGE. Deux URL, une
       * francaise et une anglaise, partageant l'identifiant de l'arbre --
       * c'est le deploiement ordinaire d'une universite suisse -- et la
       * seconde visitee servait le questionnaire dans la langue de la
       * premiere, sous son propre grand titre. La langue que la page declare
       * est la sienne ; la session ne rend une langue que si la page n'en
       * declare aucune. */
      if (!langDeclared && state.lang && arr(tree.langs).indexOf(state.lang) >= 0) {
        setLang(state.lang, true);
      }
      return true;
    }

    /* --------------------------------------------------------- announcements
     * A live region only speaks when its content CHANGES: reaching the same
     * result twice in a row would stay silent. So clear, then refill on the
     * frame after next. requestAnimationFrame is suspended in a background tab,
     * which would lose the announcement entirely, so a timer races it and the
     * first one to arrive wins. The property is TESTED and then CALLED, never
     * tested on window and called as a bare global. */
    /* CE QUI EST DIT EST CE QUI EST ECRIT. L'annonce composait la phrase avec
     * la chaine brute, si bien qu'un titre en gras se prononcait avec ses
     * asterisques : « Etape 2 sur 2 : Question **a cases** ? ». C'est la double
     * lecture que ce fichier ferme partout ailleurs, rouverte du cote sonore. */
    function announce(msg) {
      msg = asRead(msg);
      inst.live.textContent = '';
      var done = false;
      var fill = function () { if (done) return; done = true; inst.live.textContent = msg; };
      var raf = window.requestAnimationFrame;
      if (raf) raf(function () { raf(fill); });
      setTimeout(fill, 50);
    }
    inst.announce = announce;

    /* --------------------------------------------------------------- routing
     * The only branching rule of a checkbox question: "at least one ticked"
     * versus "none". `polarity` changes NOTHING here: it is a declaration for
     * human review. A polarity that altered behaviour would be one more trap. */
    function nextFrom(nodeId, value) {
      var node = tree.nodes[nodeId];
      if (node.type === 'multi') {
        var rule = isObject(node.next) ? node.next : {};
        /* "At least one ticked" means at least one value this question OFFERS.
         * Reading only the length of the list let a value the tree no longer
         * declares route the reader, with no ticked box in front of it. */
        return offeredOf(node, value).length
          ? { to: rule.ifAny, result: rule.ifAnyResult }
          : { to: rule.else, result: rule.elseResult };
      }
      var a = arr(node.answers).filter(function (x) { return x && x.value === value; })[0];
      return a ? { to: a.to, result: a.result } : {};
    }
    function answer(nodeId, value) {
      inst.answers[nodeId] = value;
      var next = nextFrom(nodeId, value);
      if (next.result && own(tree.results, next.result)) { inst.result = next.result; render(true); }
      else if (next.to && own(tree.nodes, next.to)) { inst.path.push(next.to); inst.result = null; render(true); }
      /* An unresolved target is refused at mount time, so this branch is only
       * reachable in preview mode. It says so instead of doing nothing. */
      else renderRefusal(root, [{ path: 'nodes.' + nodeId, message: phrase('noTarget', null, inst.s.msg) }],
        inst.lang, tree, inst.headingLevel);
    }
    /* Back = pop. With history on, the browser pops and onPop restores the
     * previous state, so this button and the browser's never disagree. */
    function back() {
      if (!inst.result && inst.path.length < 2) return;
      if (inst.useHistory && inst.historyDepth > 0) { inst.historyDepth--; history.back(); return; }
      if (inst.result) inst.result = null; else inst.path.pop();
      render(false, true);
    }
    function resetToStart() {
      inst.path = [tree.start];
      inst.answers = Object.create(null);
      inst.result = null;
    }
    function restart() { resetToStart(); render(true); }
    function setLang(l, quiet) {
      if (arr(tree.langs).indexOf(l) < 0) return;
      inst.lang = l;
      inst.s = makeStrings(l, tree);
      if (!quiet) render(false);
    }

    /* ---------------------------------------------------------------- render
     * `push` is true for a forward navigation: focus moves, the change is
     * announced, the page scrolls and a history entry is pushed. Anything not
     * foreseen ends as a refusal in the container rather than an empty one
     * (principle 6). */
    function render(push, speak) {
      try { paint(push, speak); }
      catch (e) {
        renderRefusal(root, [{ path: 'render', message: phrase('renderFailed', { error: e && e.message }, inst.s.msg) }],
          inst.lang, tree, inst.headingLevel);
      }
    }
    function paint(push, speak) {
      root.textContent = '';
      root.classList.add('aigo');
      root.appendChild(inst.live);

      var main = el('div', 'aigo-main');
      var stepLabel = renderProgress(inst, main);
      var focusTarget = inst.result ? renderResult(inst, main) : renderQuestion(inst, main);
      root.appendChild(main);

      if (push || speak) {
        /* preventScroll: moving the focus scrolls by default, which would
         * cancel the deliberate repositioning below. */
        focusTarget.focus({ preventScroll: true });
        var title = inst.result ? text(inst, tree.results[inst.result].title) : text(inst, tree.nodes[currentNode(inst)].title);
        var lead = inst.result ? inst.s.resultLabel : stepLabel;
        announce((lead ? lead + inst.s.colon : '') + (title || ''));
        try { root.scrollIntoView({ block: 'start', behavior: reducedMotion() ? 'auto' : 'smooth' }); }
        catch (e) { root.scrollIntoView(); }
      }

      save();
      if (inst.useHistory) {
        try {
          /* LA PROFONDEUR VOYAGE DANS L'ENTREE, a cote du marqueur et hors de
           * `s` : snapshot() ne change donc pas de forme. Portee par la seule
           * instance, elle survivait a une reprise de session et le bouton
           * Retour appelait history.back() sur des entrees qui n'etaient pas
           * les siennes, faisant sortir le lecteur de la page. */
          if (push) { inst.historyDepth++; history.pushState({ aigo: historyTag, d: inst.historyDepth, s: snapshot() }, ''); }
          /* Not a push: a Back that walked the path by hand, after a reload for
           * instance. The entry we stand on still describes the view we just
           * left, and the next browser Back would return to it. */
          else history.replaceState({ aigo: historyTag, d: inst.historyDepth, s: snapshot() }, '');
        } catch (e) {}
      }
      root.setAttribute('lang', inst.lang);
      root.setAttribute('data-ai-go-engine', VERSION);
      root.setAttribute('data-ai-go-content', fingerprint(tree));
      root.setAttribute('data-ai-go-signature', signature(tree));
      if (inst.mode === 'preview') {
        /* The banner says what mode this is. A tree that overrides its two
         * strings with nothing at all would leave a preview looking exactly
         * like a published page, so an override that says nothing is not an
         * override: the engine's own words come back. What the surrounding
         * page's stylesheet does with the banner is beyond this engine's reach,
         * which is why preview no longer exists off a local machine. */
        var key = inst.issues.length ? 'previewBanner' : 'previewOk';
        var words = solid(inst.s[key]) ? inst.s[key] : UI.en[key];
        var banner = el('div', 'aigo-banner');
        banner.appendChild(el('p', null, fmt(words, { n: inst.issues.length })));
        /* AND WHICH POINTS. The banner counted and stopped there. It is the only
         * screen a person who does not program ever sees of this check, and it
         * sent her to another file to learn that the field was `jurisdiction`.
         * Same list as the strict refusal box, same sentences, same order. */
        if (inst.issues.length) banner.appendChild(issueList(inst.issues, inst.s));
        root.insertBefore(banner, root.firstChild);
      }
      /* In an iframe the parent decides the height, and a question can land
       * outside the visible area after a navigation. The height is posted; a
       * parent that does not listen loses nothing. It is the only thing this
       * engine ever sends anywhere, and it never leaves the browser. */
      postHeight();
    }
    function postHeight() {
      try {
        if (window.top === window.self) return;
        window.parent.postMessage({ aigo: 'height', px: document.documentElement.scrollHeight }, '*');
      } catch (e) {}
    }

    /* ------------------------------------------------------------- lifecycle */
    function onPop(ev) {
      var st = ev.state;
      if (!st || st.aigo !== historyTag) return;
      /* L'ENTREE DIT COMBIEN CETTE INSTANCE EN A POUSSE. L'entree de base porte
       * zero, si bien qu'un Retour navigateur jusqu'a elle rend au bouton de la
       * page la bonne idee de ce qu'il peut encore depiler. */
      if (typeof st.d === 'number') inst.historyDepth = st.d;
      if (!restore(st.s)) resetToStart();
      render(false, true);
    }
    /* bfcache: coming back from another site restores the page as it was;
     * nothing else resynchronises the state. */
    function onShow(ev) { if (ev.persisted) { readSession(); render(false); } }

    if (inst.useHistory) window.addEventListener('popstate', onPop);
    window.addEventListener('pageshow', onShow);

    /* PUBLIC. The engine's own views call this with the question they are
     * drawing and a value they have just read off a box, so they cannot be
     * wrong. A PAGE calling it can be: answering a question the reader is not
     * standing on, or with a value that question never offered, used to walk
     * the reader to a verdict nothing on screen had proposed, and to write that
     * answer into the session on the way. Both are refused, and say so with
     * false; a legitimate answer returns true. */
    inst.answer = function (nodeId, value) {
      if (inst.result || nodeId !== currentNode(inst)) return false;
      if (!own(tree.nodes, nodeId) || !isOffered(tree.nodes[nodeId], value)) return false;
      answer(nodeId, value);
      return true;
    };
    inst.back = back;
    inst.restart = restart;
    inst.setLang = function (l) { setLang(l, false); };
    /* Interaction-time save. paint() pushes a snapshot when a view is drawn,
     * that is before any answer exists on it. Ticking a box must also update
     * the entry we are standing on, or Back restores a snapshot taken too early
     * and the boxes come back empty. Hooked on inst.save, never on save():
     * paint() calls save() before pushState, and a replaceState there would
     * overwrite the previous entry and shift the whole stack by one. */
    inst.save = function () {
      save();
      if (inst.useHistory) {
        try { history.replaceState({ aigo: historyTag, d: inst.historyDepth, s: snapshot() }, ''); } catch (e) {}
      }
    };
    inst.getState = snapshot;
    inst.destroy = function () {
      if (inst.useHistory) window.removeEventListener('popstate', onPop);
      window.removeEventListener('pageshow', onShow);
      /* ET LA CLE EST RENDUE. claimKey() l'avait reservee au montage ; sans
       * cette ligne un remontage en prenait une autre, la session precedente
       * n'etait plus reprise, et les reponses s'accumulaient en copies
       * orphelines. `defaultKey` et non inst.storageKey : une cle fournie par
       * l'appelante n'a jamais ete reservee ici. */
      if (!dead) { dead = true; delete liveKeys[defaultKey]; }
      /* ET LA MARQUE D'HISTORIQUE AVEC ELLE. Laissee sur un conteneur mort,
       * elle empechait le questionnaire encore vivant d'a cote de prendre
       * l'historique. data-ai-go-mounted reste : c'est lui qui tient
       * l'idempotence du montage. */
      if (root.removeAttribute) root.removeAttribute('data-ai-go-history');
      root.textContent = '';
      root.classList.remove('aigo');
    };
    Object.defineProperty(inst, 'node', { get: function () { return inst.result ? null : currentNode(inst); } });

    if (opt.resume !== false) readSession();
    render(false);
    if (inst.useHistory) {
      try { history.replaceState({ aigo: historyTag, d: inst.historyDepth, s: snapshot() }, ''); } catch (e) {}
    }
    return inst;
  }

  /* ===========================================================================
   * 8. AUTO-MOUNT BY ATTRIBUTE
   *
   * Every container carrying data-ai-go is mounted once, reading data-lang,
   * data-history="false", data-storage="none", data-mode and
   * data-heading-level. Default language: the page language when the tree
   * declares it. On a page carrying TWO questionnaires, the FIRST container
   * takes the browser history and the others mount without it: both taking it
   * made the second replace the first's entry underneath, and the first Back
   * button died on its first click. data-history="false" picks another one.
   * ======================================================================== */

  function mountAll(scope) {
    if (typeof document === 'undefined') return [];
    var made = [];
    (scope || document).querySelectorAll('[data-ai-go]:not([data-ai-go-mounted])').forEach(function (root) {
      root.setAttribute('data-ai-go-mounted', '1');
      var name = root.getAttribute('data-ai-go');
      var tree = (typeof window !== 'undefined') ? window[name] : undefined;
      var docLang = (document.documentElement.lang || '').split(/[-_]/)[0].toLowerCase();
      var lang = root.getAttribute('data-lang') || null;
      if (!isObject(tree)) {
        renderRefusal(root, [{ path: name, message: fmt(makeStrings(lang || docLang, null).notLoaded, { name: name }) }],
          lang || docLang, null, root.getAttribute('data-heading-level'));
        return;
      }
      /* La page a-t-elle DIT sa langue, ou l'a-t-on deduite de l'arbre ? Si elle
       * l'a dite, la session d'une autre page ne la contredit pas. */
      var declared = !!lang || arr(tree.langs).indexOf(docLang) >= 0;
      if (!lang) lang = arr(tree.langs).indexOf(docLang) >= 0 ? docLang : (tree.defaultLang || arr(tree.langs)[0]);
      /* UN SEUL CONTENEUR PREND L'HISTORIQUE. Deux questionnaires sur une page
       * le prenaient tous les deux, et le second remplacait l'entree du premier
       * sous lui : le bouton Retour du premier mourait au premier clic. Le guide
       * demandait a l'integrateur d'y penser ; c'est au montage de le faire, et
       * le premier conteneur rencontre le garde. Sans etat global : la marque
       * est posee sur le conteneur lui-meme, et se lit dans la meme portee que
       * celle ou l'on monte. */
      /* CHERCHEE DANS LE DOCUMENT, ET NON DANS LA PORTEE. Deux appels a
       * mountAll sur des portees differentes ne se voyaient pas, les deux
       * questionnaires prenaient l'historique, et le symptome d'origine
       * revenait en pire : le bouton Retour du premier deplacait le second.
       * L'historique du navigateur appartient au document entier. */
      var held = (typeof document !== 'undefined' ? document : scope)
        .querySelectorAll('[data-ai-go-history]');
      var takes = root.getAttribute('data-history') !== 'false' && !held.length;
      if (takes) root.setAttribute('data-ai-go-history', '1');
      made.push(mount(root, tree, {
        lang: lang,
        langDeclared: declared,
        history: takes,
        /* undefined, not a key of our own: mount() derives the default and
         * hands out a distinct one per live instance. Computing it here gave
         * two containers of the same tree one shared session. */
        storageKey: root.getAttribute('data-storage') === 'none' ? null : undefined,
        mode: root.getAttribute('data-mode') || undefined,
        headingLevel: root.getAttribute('data-heading-level') || undefined
      }));
    });
    return made;
  }
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { mountAll(); });
    else setTimeout(function () { mountAll(); }, 0);
  }

  return {
    version: VERSION,
    UI: UI,
    POLICY: POLICY,
    mount: mount,
    mountAll: mountAll,
    structure: structure,
    guard: guard,
    fingerprint: fingerprint,
    examplePrint: examplePrint,
    /* Exported so the harness can assert that the review clock reads the date
     * the same way the check does, and not one the check has refused. */
    reviewAgeDays: reviewAgeDays,
    /* Les deux tables d'ecritures, exportees pour que le harnais verifie
     * qu'elles se recouvrent : une ecriture nommee sans plage fait perdre le
     * verdict entier, et une langue latine sur cette liste ouvrirait le verrou
     * pour tous les arbres francais et anglais. */
    LANG_SCRIPTS: LANG_SCRIPTS,
    SCRIPT_RANGES: SCRIPT_RANGES,
    signature: signature,
    hash: hash,
    plain: plain
  };
})();
</script>
