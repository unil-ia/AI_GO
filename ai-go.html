<!-- ============================================================================
     AI_GO-BEGIN

     CE FICHIER A DEUX MOITIÉS.
     Au-dessus de AI_GO-ENGINE-BEGIN : la vôtre. Vos questions, votre titre, vos
     couleurs. Une mise à jour n’y touche jamais.
     De AI_GO-ENGINE-BEGIN à AI_GO-ENGINE-END : le moteur. N’y touchez pas. Une
     mise à jour remplace ce bloc entier et écraserait vos modifications.

     ESSAYEZ-LE : double-cliquez sur ce fichier. Il tourne, avec un bandeau
     d’aperçu qui compte ce qui reste à remplir. Ni serveur, ni terminal, ni npm.
     VÉRIFIEZ-LE : ouvrez check.html et déposez ce fichier dessus.
     PUBLIER, TRADUIRE, INTÉGRER DANS UN CMS : docs/INTEGRATE.md, une page.
     ========================================================================= -->
<script>
/* =============================================================================
   AI_GO-CONTENT-BEGIN
   VOTRE CONTENU. C’est la seule région que vous modifiez.

   TROIS RÈGLES DE MAISON POUR CHAQUE TEXTE
   1. GUILLEMETS DROITS DOUBLES. Une apostrophe droite dans une chaîne écrite
      entre guillemets simples casse le fichier entier et la page reste blanche.
   2. L’espace insécable s’écrit \u00a0, jamais tapée : tapée, elle est
      invisible dans un éditeur et se perd au copier-coller. Écrivez votre
      français normalement, puis lancez une fois la commande
      node tools/typographie.mjs ai-go.html, qui la pose pour vous.
   3. AUCUN CHEVRON dans un texte. Une balise ouverte dans une question ferme ce
      bloc et la page meurt avant que le moteur démarre. check.html la signale.

   Le gras s’écrit avec deux astérisques de chaque côté. C’est la seule syntaxe
   en ligne, et aucun HTML n’est jamais interprété. Un texte est une chaîne, ou
   une liste dont chaque membre est un paragraphe ou un bloc
   { items: ["un", "deux"] } pour une liste à puces. Le bloc va DANS la liste
   et jamais seul : seul, il est lu comme une traduction et refusé.

   DEUX LANGUES, LE FRANÇAIS D’ABORD. Cet exemple est bilingue : chaque texte
   s’écrit { fr: "...", en: "..." }, et une langue déclarée dans langs qui
   manque à un seul texte fait refuser le fichier au montage. Pour n’en garder
   qu’une, réduisez langs et defaultLang à cette langue, et chaque texte
   redevient une chaîne simple.

   SPDX-License-Identifier: CC0-1.0
   L’EXEMPLE LIVRÉ ICI et le format de l’arbre sont sous CC0 : recopiez-les sans
   condition. Le bloc du moteur, plus bas, a sa propre licence (LICENSE).
   CE QUE VOUS ÉCRIREZ À LA PLACE EST À VOUS, et cette ligne ne le dit pas :
   remplacez-la par votre propre mention avant de publier, sinon votre analyse
   juridique part sous CC0 sans que vous l’ayez voulu.
   ========================================================================== */

var AI_GO_CONTENT = {

  /* id : court, unique, et à changer dès que vous adaptez l’arbre de quelqu’un
     d’autre. Celui livré ici est un texte à remplacer, comme les TO_FILL_IN.
     version : la vôtre ; une session enregistrée sous une autre version est
     abandonnée plutôt que reprise sur les mauvaises questions.
     langs : chaque langue déclarée exige chaque texte. N’en gardez qu’une et
     chaque texte redevient une chaîne simple. */
  id: "my-questionnaire",
  version: "1.0.0",
  langs: ["fr", "en"],
  defaultLang: "fr",
  start: "q1",

  /* LA SIGNATURE. Le moteur REFUSE d’afficher quoi que ce soit tant qu’un texte
     à remplacer TO_FILL_IN demeure, ou quand le nom d’hôte de la page n’est pas
     couvert par publisher.domains. Déclarez aussi votre préproduction. Un
     sous-domaine d’un domaine déclaré est couvert ; un autre domaine, non. */
  publisher: { name: "TO_FILL_IN", domains: ["TO_FILL_IN"] },

  /* Qui a relu ce contenu, et quand (AAAA-MM-JJ). Imprimé sous chaque résultat
     avec l’empreinte du contenu : c’est le lien entre la feuille qu’a signée
     votre service juridique et la page qui est en ligne. */
  review: { by: "TO_FILL_IN", date: "TO_FILL_IN" },

  /* ADAPTÉ DE L’ARBRE DE QUELQU’UN D’AUTRE ? Nommez la source ici et chaque
     résultat dira qu’elle n’a pas relu votre version. Hors du domaine de la
     source, c’est le seul champ qui ait le droit de la nommer : une chaîne, ou
     { name: "...", url: "...", licence: "..." }. Une quatrième clé, `note`,
     reçoit votre propre phrase, et le verrou la lit comme tout le
     reste : n’y nommez pas la source.
  derivedFrom: "AI_GO, Universite de Lausanne",
  */

  /* Le droit que cet arbre encode, par exemple "CH-VD" ou "DE-BY". Lu par
     check.html, jamais par le questionnaire. */
  jurisdiction: "TO_FILL_IN",
  legalBasis: ["TO_FILL_IN"],

  /* Affiché sous chaque résultat, exigé dans chaque langue déclarée. Remplacez
     le texte entier par le vôtre, validé dans votre institution. */
  disclaimer: {
    fr: "**Avertissement\u00a0:** outil d’aide à la décision, il ne remplace pas un conseil juridique. L’utilisateur·rice reste responsable de l’appréciation finale. TO_FILL_IN",
    en: "**Disclaimer:** a decision-support tool, it does not replace legal advice. The user remains responsible for the final assessment. TO_FILL_IN"
  },

  /* UNE TROISIÈME LANGUE D’INTERFACE. Le moteur porte un jeu de libellés
     français et un jeu anglais. Pour toute autre langue, déclarez-la dans
     langs, donnez sa variante à chaque texte, et écrivez ici vos propres
     libellés de boutons : ils vivent dans VOTRE moitié du fichier et survivent
     aux mises à jour du moteur. La liste des clés est en tête du bloc du
     moteur, et dans docs/INTEGRATE.md.

  ui: { de: { back: "Zurueck", continue: "Weiter", yes: "Ja", no: "Nein",
              stepOf: "Schritt {n} von {total}", resultLabel: "Ergebnis",
              restart: "Fragebogen neu starten", progressLabel: "Fortschritt",
              solutionLabel: "Empfohlene Loesung", allowedLabel: "Erlaubte Werkzeuge",
              forbiddenLabel: "Verboten:", newTab: "(oeffnet in einem neuen Tab)" } },

  CETTE LISTE N’EST PAS LA LISTE ENTIÈRE. Le moteur porte 31 clés, et celles qui
  manquent ci-dessus sont celles qu’un lecteur ou une lectrice rencontre en
  chemin : colon, solutionLabelLegal, reviewedOn, loadError, notLoaded,
  staleError, chooseOne, notPublished, notPublishedLead, previewBanner,
  previewOk, contentId, signatureId, expiredReview, attribution,
  attributionUrl, attributionLicence, attributionBoth, msg. La liste
  complète, avec le décompte, est en tête du bloc moteur. Oubliez-en une et elle
  est servie en anglais. check.html liste celles qui vous manquent ; le jeu
  complet est en tête du bloc du moteur.
  */

  /* LES ÉTAPES, le fil d’Ariane. « Étape 2 sur 3 » se déduit de cette liste :
     aucun total n’est figé dans une phrase. Chaque question pointe vers une
     étape avec step ; plusieurs questions peuvent partager la même. */
  steps: [
    { id: "s1", name: { fr: "Personnes concernées", en: "People concerned" } },
    { id: "s2", name: { fr: "Catégories particulières", en: "Special categories" } },
    { id: "s3", name: { fr: "Partage", en: "Sharing" } }
  ],

  /* LES LIENS, déclarés une fois et rappelés par leur identifiant depuis les
     résultats. La personne qui traduit ne voit jamais une adresse, donc n’en
     casse aucune. external: true ajoute target, rel="noopener noreferrer" et le
     « ouvre dans un nouvel onglet » annoncé aux lecteurs d’écran. Schémas
     acceptés : https, http, mailto, tel, et les chemins relatifs. */
  links: {
    guide:   { label: { fr: "Guide interne", en: "Internal guide" },
               external: true, href: "https://example.org/guide" },
    contact: { label: { fr: "Contacter l’unité compétente", en: "Contact the relevant unit" },
               external: true, href: "https://example.org/contact" }
  },

  nodes: {

    /* CHOIX UNIQUE. Chaque réponse porte sa propre destination : to pour une
       question, result pour un résultat. On omet label sur « oui » et « non » :
       le moteur emploie alors ses propres Oui / Non, et ajouter une langue
       d’interface coûte deux chaînes, pas deux par question. detail est la
       ligne affichée sous le libellé. */
    q1: {
      type: "single",
      step: "s1",
      title: { fr: "Vos données permettent-elles de remonter à une personne\u00a0?",
               en: "Can your data be traced back to a person?" },
      help: { fr: "Directement ou indirectement\u00a0: un nom, un matricule, une adresse IP, ou une combinaison de champs qui ne laisse plus qu’une personne possible.",
              en: "Directly or indirectly: a name, a staff number, an IP address, or a combination of fields that leaves only one possible person." },
      answers: [
        { value: "yes", to: "q2", detail: { fr: "Oui, ce sont des données personnelles",
                                            en: "Yes, this is personal data" } },
        { value: "no",  to: "q3", detail: { fr: "Non, aucune personne n’est concernée",
                                            en: "No, no individual is concerned" } }
      ]
    },

    /* CASES À COCHER. Le routage est une propriété de TOUT le jeu de cases,
       « au moins une cochée » contre « aucune », jamais d’une case prise seule.
       Ajouter une option ne change rien d’autre.

       polarity est une déclaration destinée aux relecteurs et relectrices,
       vérifiée mais jamais utilisée par le moteur : "direct" quand cocher mène
       au résultat le plus prudent, ce qui est le cas ordinaire, "inverse" quand
       cocher est ce qui fait SORTIR de la branche prudente. Déclarez-la, pour
       que l’intention survive à la traduction et à la relecture. Quelqu’un de
       bonne foi qui « corrige » une question inverse pour l’aligner sur les
       autres envoie des données à faible risque dans la branche restrictive. */
    q2: {
      type: "multi",
      step: "s2",
      polarity: "direct",
      title: { fr: "Ces données relèvent-elles d’une catégorie particulière\u00a0?",
               en: "Does this data fall into a special category?" },
      help: { fr: "**Cochez tout ce qui s’applique, ou continuez si rien ne s’applique.**",
              en: "**Tick everything that applies, or continue if nothing applies.**" },
      options: [
        { value: "health",   label: { fr: "Santé, données génétiques ou biométriques",
                                      en: "Health, genetic or biometric data" } },
        { value: "opinions", label: { fr: "Opinions religieuses, philosophiques, politiques ou syndicales",
                                      en: "Religious, philosophical, political or trade-union opinions" } },
        { value: "legal",    label: { fr: "Poursuites ou sanctions pénales et administratives",
                                      en: "Criminal or administrative proceedings and sanctions" } }
      ],
      /* ifAny / ifAnyResult : au moins une case cochée. else / elseResult :
         aucune. ifAny et else prennent un identifiant de question, ifAnyResult
         et elseResult un identifiant de résultat. */
      next: { ifAnyResult: "restricted", else: "q3" }
    },

    q3: {
      type: "single",
      step: "s3",
      title: { fr: "Le partage de ces données est-il restreint par un engagement\u00a0?",
               en: "Is the sharing of this data restricted by an undertaking?" },
      help: { fr: "Par exemple\u00a0: un secret de fonction, un secret professionnel, un accord de confidentialité.",
              en: "For example: official secrecy, professional secrecy, a confidentiality agreement." },
      answers: [
        { value: "yes", result: "restricted", detail: { fr: "Au moins une restriction s’applique",
                                                        en: "At least one restriction applies" } },
        { value: "no",  result: "open",       detail: { fr: "Le partage n’est pas restreint",
                                                        en: "Sharing is unrestricted" } }
      ]
    }
  },

  /* LES RÉSULTATS, les issues.
     level : "success" | "info" | "warning" | "danger", la couleur de la carte.
     solution.label : "plain" (par défaut) ou "legal" reprend un libellé du
       moteur ; toute autre chaîne est votre propre texte.
     allowed : des identifiants de liens, listés sous « Outils autorisés ».
     forbidden : des textes, listés sous « Interdictions ».
     alert : une remarque encadrée de plus, avec son propre niveau. */
  results: {

    open: {
      level: "success",
      title: { fr: "Aucune restriction particulière", en: "No particular restriction" },
      summary: { fr: "Ce questionnaire ne relève aucune contrainte sur vos données.",
                 en: "This questionnaire identifies no constraint on your data." },
      solution: { label: "plain", text: { fr: "Usage libre", en: "Unrestricted use" } },
      allowed: ["guide"]
    },

    restricted: {
      level: "warning",
      title: { fr: "Usage restreint", en: "Restricted use" },
      summary: { fr: "Vos données demandent des précautions particulières.",
                 en: "Your data requires particular care." },
      solution: { label: "legal", text: { fr: "Solutions internes uniquement",
                                          en: "Internal solutions only" } },
      allowed: ["guide", "contact"],
      forbidden: [{ fr: "Aucun service externe sans contrat",
                    en: "No external service without a contract" }],
      alert: {
        level: "warning",
        text: { fr: "**À vérifier\u00a0:** ce texte est un exemple. Remplacez-le par votre propre analyse, validée dans votre institution.",
                en: "**To check:** this text is an example. Replace it with your own analysis, validated in your institution." }
      }
    }
  }
};

/* =============================================================================
   AI_GO-CONTENT-END
   ========================================================================== */
</script>

  </noscript>

.aigo-option-text { display: flex; flex-direction: column; gap: .125rem; }
.aigo-option-label { font-weight: 600; }
.aigo-option-detail { font-size: .9375rem; color: var(--aigo-fg-muted); }

.aigo-buttons { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }
.aigo-btn { padding: .625rem 1.25rem; border-radius: var(--aigo-radius); font-weight: 600; border: 1px solid transparent; }
.aigo-btn-primary { background: var(--aigo-accent); color: var(--aigo-accent-fg); }
/* currentColor here is the button's own white, an invisible ring on a light
   page. The ring sits outside the button, so it takes the accent instead. */
.aigo-btn-primary:focus-visible { outline-color: var(--aigo-accent); }
.aigo-btn-primary:hover { filter: brightness(1.1); }
.aigo-btn-ghost { border-color: var(--aigo-border-strong); color: var(--aigo-fg); }
.aigo-btn-ghost:hover { background: var(--aigo-bg-subtle); }

.aigo-result { display: flex; flex-direction: column; gap: 1.25rem; }
.aigo-alert { padding: 1rem 1.125rem; border-radius: var(--aigo-radius); border-left: 4px solid; font-size: .9375rem; }
.aigo-alert-success { background: var(--aigo-success-subtle); border-color: var(--aigo-success); }
.aigo-alert-warning { background: var(--aigo-warning-subtle); border-color: var(--aigo-warning); }
.aigo-alert-danger  { background: var(--aigo-danger-subtle);  border-color: var(--aigo-danger); }
.aigo-alert-info    { background: var(--aigo-info-subtle);    border-color: var(--aigo-info); }
.aigo-result-title { display: block; font-size: 1.0625rem; margin-bottom: .375rem; }
.aigo-result-title:focus { outline: none; }
.aigo-result-title:focus-visible { outline: 2px solid var(--aigo-accent); outline-offset: 4px; }

.aigo-solution { border: 1px solid var(--aigo-border); border-radius: var(--aigo-radius); padding: 1rem 1.125rem; }
.aigo-solution-label {
  font-size: .75rem; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--aigo-fg-muted); margin-bottom: .25rem;
}
.aigo-solution-text { font-size: 1.125rem; font-weight: 600; }

.aigo-block-title {
  font-size: .8125rem; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; color: var(--aigo-fg-muted); margin-bottom: .5rem;
}
.aigo-block + .aigo-block { margin-top: var(--aigo-gap); }
.aigo-block .aigo-list { display: flex; flex-direction: column; gap: .375rem; }
.aigo-block .aigo-list li { padding-left: 1rem; position: relative; }
.aigo-block .aigo-list li::before {
  content: ""; position: absolute; left: 0; top: .7em;
  width: 5px; height: 1px; background: var(--aigo-border-strong);
}

.aigo-link { color: var(--aigo-accent); }
.aigo-foreign-host { color: var(--aigo-fg-muted); font-size: .8125rem; }
.aigo-disclaimer { font-size: .875rem; }
/* Le rouge dit une erreur, et rien d'autre dans cette feuille ne l'emploie. */
.aigo-choose { margin: .75rem 0 0; font-size: .875rem; font-weight: 600; color: var(--aigo-danger); }

/* Footer: publisher, review date, attribution, content fingerprint. */
.aigo-review {
  font-size: .8125rem; color: var(--aigo-fg-muted);
  border-top: 1px solid var(--aigo-border); padding-top: .75rem; margin: 0;
}
.aigo-review p { margin: 0 0 .25rem; }
.aigo-review-expired { color: var(--aigo-warning); font-weight: 600; }
.aigo-attribution { font-style: italic; overflow-wrap: anywhere; }

   juridique recopie pour relier sa feuille signee a la page en ligne. */

.aigo-error > h1, .aigo-error > h2, .aigo-error > h3,
.aigo-error > h4, .aigo-error > h5, .aigo-error > h6 { font-size: 1rem; font-weight: 600; margin: 0 0 .5rem; }

 * banner is what an editor sees on a local preview. */
.aigo-error {
  border: 2px solid var(--aigo-danger); background: var(--aigo-danger-subtle);
  padding: 1rem 1.25rem; border-radius: var(--aigo-radius);
}
.aigo-error strong { display: block; font-size: 1.05rem; margin-bottom: .35rem; }
.aigo-error ul { margin: .5rem 0 0; padding-left: 1.25rem; font-size: .9rem; }
.aigo-error code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }

.aigo-banner {
  margin: 0 0 1rem; padding: .5rem .875rem;
  font-size: .8125rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  background: var(--aigo-warning-subtle); color: var(--aigo-warning);
  border-left: 4px solid var(--aigo-warning);
}
.aigo-banner p { margin: 0; }

 * wrong for a field name: `jurisdiction` set in capitals is not the string
 * anybody will search for in their file. The list keeps the banner's colour and
 * none of the rest of its treatment. list-style is stated rather than inherited,
 * because the reset of the surrounding page is not this engine's to assume. */
.aigo-banner .aigo-issues {
  margin: .5rem 0 0; padding-left: 1.25rem; list-style: disc;
  font-weight: 400; letter-spacing: normal; text-transform: none;
}
.aigo-banner .aigo-issues code, .aigo-error .aigo-issues code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em;
}

/* Print: a reader who obtains a recommendation attaches it to a data
 * management plan. The link URL is written after the link text. */
@media print {
  .aigo-buttons, .aigo-steps, .aigo-progress-meta, .aigo-banner { display: none; }
  .aigo { max-width: none; color: #000; }

     regles de niveau ont posee : sur le papier qui part au plan de gestion de
     donnees, les quatre gravites devenaient la meme boite. */
  .aigo-alert { border-style: solid; border-width: 1px 1px 1px 4px; background: none; }

       * made the engine compose a certification one clause before its own
       * denial. A name is a name: one line, no sentence break. A licence is an
       * identifier: short, and drawn from the characters licence names use. */
      var oneLine = function (v) { return typeof v === 'string' && !/[\r\n\t]/.test(v); };

       * premier -- n'en avait aucune : quatre cent quatre-vingt-dix-sept
       * caracteres sur deux lignes, nommant l'origine, exempts du verrou, et le
       * moteur les mettait dans sa propre phrase. La forme courte est un nom,
       * comme l'autre. */
      if (dfName != null && !(oneLine(dfName) && dfName.length <= 200)) {

         * troisieme exempte du verrou et le seul reste sans forme : le moteur
         * l'ecrit entre parentheses dans sa propre phrase, et il suffisait d'y
         * refermer la parenthese pour ajouter « Valide par l'Universite de

         * though the source had certified the copy. That shape refused

         * value only has to be one line of a readable length. */
        var lic = tree.derivedFrom.licence;

         * nom officiel que SPDX publie. Une borne est la pour refuser un traite,

         * copy wrote "reviewed and certified by the University of Lausanne" in

     * other silence, which is the fallback this check exists to forbid. */

     * solid() is the one above, shared with the guard. */

     * JSON.stringify les ecrit tous deux `null`. Deux arbres dont les reponses
     * menaient a des conclusions opposees rendaient donc le meme recu, tous
     * deux publiables, chacun affichant l'inverse de l'autre. Le brassage n'y
     * pouvait rien : ce qui lui etait donne a hacher etait deja identique. */

         * value look independent on screen and are not: unticking either empties
         * the set, the other stays visibly ticked, and Continue then takes the
         * "none" branch. That is a wrong legal branch with a ticked box in front
         * of it, which is the one failure this whole tool exists to avoid. */

         * second unreachable: clicking it lands on the first one's target. */
        var seen = Object.create(null);
        answers.forEach(function (a, i) {
          var v = isObject(a) ? a.value : null;

          /* A STRING, not merely something truthy. The reader's radio carries a
           * string and the router compares with ===, so a value of 1 or true made
           * a branch nobody could take with a keyboard: the validator counted the
           * path, the receipt signed it, and Continue answered "choose an answer"
           * for ever. Three of five signed paths were unreachable that way. */
          if (typeof a.value !== 'string' || !a.value) bad(aw, 'answerNoValue');
          texts(aw + '.label', a.label);
          texts(aw + '.detail', a.detail);

      need(w + '.title', r.title);
      texts(w + '.summary', r.summary);
      /* `solution` and `alert` are CONTAINERS: the engine draws `text` inside
       * them. Testing them with isObject() let a String object stand in for the
       * container, its `.text` read as undefined, and the whole check skipped in
       * silence, while the reader got a solution box with a heading and no
       * solution in it. Reported where the words are missing, not on the box. */
      if (r.solution != null) {
        if (!isPlainObject(r.solution)) bad(w + '.solution.text', 'badText');

           * a text of the tree's own, drawn like any other and checked so. */

      if (!link.href) bad('links.' + id, 'linkNoHref');
      else if (!safeHref(link.href)) bad('links.' + id, 'badScheme', { href: String(link.href).slice(0, 40) });
    });

    arr(tree.steps).forEach(function (s, i) {
      if (isObject(s)) need('steps[' + i + '].name', s.name);
      else bad('steps[' + i + ']', 'nodeUnreadable');
    });

  /* ===========================================================================
   * 4. PUBLICATION GUARD
   *
   * A tree is not displayed until it is signed (publisher, review), dated,
   * carries its disclaimer in every declared language, and is free of
   * placeholders. On refusal the container shows the list of points, and
   * nothing else.
   *

   * engine keeps its own tree as a labelled example, and asks that verbatim
   * copies on other domains replace its name, links and identifier. It is a
   * courtesy lock against accidental copy, not a security boundary: it is
   * data, and it is mutable. What it cannot catch: an institution retyping the
   * original content under its own name. The licence (non-endorsement clause)
   * and that institution's own responsibility apply then.

   * check.html does not carry a second one, it runs this one, taken from the
   * very file it was given.

   * to it, so "UNIL_2026", "_UNIL", "UNIL2026" and "AI_GO_v3" all sat INSIDE a

   * stand next to it is anything that is not a Latin letter.

   * is the word itself and every reader of it, this file and check.html alike,

   * THIS engine is the same either way. */

    reservedHosts: ['unil.ch'],                 // links to these hosts are refused elsewhere

     * use, and "Internal guide" is ordinary English that an adopter has every
     * right to write on a link of its own. So the example became a fingerprint,
     * and the fingerprint covered `links` too. That was a rule that could never
     * fire: the example's two links point at example.org, example.org is on
     * docDomains and refused on its own, so every adopter is OBLIGED to change

     * this line was ever read. What is compared here is therefore the reading
     * matter alone, `examplePrint`, which the adopter is not obliged to touch
     * and which is exactly what must not be republished under a new signature.

   * and the next script would have walked past sixty-three more. skeletonOf()

   * table still buys is PRECISION: a letter it knows is folded to the Latin one,
   * so the refusal quotes the origin's name as such instead of a skeleton.
   *

           * tree's own languages uses? If it is, the tree is speaking its own
           * language. If it is not, four unreadable letters are standing exactly
           * where a name should be, and it does not matter what surrounds them.
           *
           * A second question used to be asked first -- does the string carry a
           * Latin letter anywhere? -- on the reasoning that prose in another
           * writing imitates nothing. That is true of a sentence and false of a
           * field: `publisher.name` holds four letters and nothing else, so an
           * institution could sign its own page « <small capitals UNIL> », on
           * its own domain, without declaring a single language, and the guard
           * returned nothing at all. The remedy for a legitimate word in another
           * writing is the one the refusal names: declare the language. */
          if (!/[^\u0000]/.test(m[0]) && ownScript(span, scripts)) {
            from = m.index + 1;
            continue;
          }
          hit = span;
        }
      }
      /* UNE PORTEE, UN POINT. Deux mots reserves qui rendent exactement la
       * meme portee rendent aussi exactement le meme message : le second ne
       * distingue rien et fait croire a deux defauts la ou il y en a un. */
      if (hit !== null && out.indexOf(hit) < 0) out.push(hit);
    }
    return out;
  }

  /* Returns [{ path, message }]; empty means publishable on `hostname`. An
   * empty or local hostname skips the domain checks only (local preview). */
  function guard(tree, hostname) {
    var out = [];
    var fz = freezeTree(tree);
    var msgs = msgsFor(fz.value);
    function bad(path, key, vars) { out.push({ path: path, message: phrase(key, vars, msgs) }); }
    fz.bad.forEach(function (b) { bad(b.path, b.key, b.vars); });
    if (fz.value === null) return out;
    try { verdict(fz.value, hostname, bad); }
    catch (e) { bad('tree', 'renderFailed', { error: String((e && e.message) || e) }); }
    return out;
  }
  function verdict(tree, hostname, bad) {
    if (!isObject(tree)) { bad('tree', 'treeUnreadable'); return; }
    hostname = String(hostname || '').toLowerCase();
    /* Two different questions. `local` relaxes the domain declaration, since a
     * preview has no domain to declare. `named` is what the origin exemption
     * needs: an empty hostname is not a local machine, it is an unknown one,
     * and it is what an about:srcdoc frame and a validator both report. */
    var local = isLocalHost(hostname);
    var named = hostname !== '' && isLocalHost(hostname);

    var pub = isObject(tree.publisher) ? tree.publisher : {};
    var domains = arr(pub.domains);
    var links = isObject(tree.links) ? tree.links : {};
    /* A signature has to be readable text. `publisher.name: true` satisfied a
     * truthiness test and printed a footer reading "true, reviewed by true", and
     * a name made of zero-width spaces printed nothing at all. Same solid() as
     * the structural check: one definition of "there are words here". */
    if (!solid(pub.name)) bad('publisher.name', 'publisherName');
    var hasSentinel = function (str) { return POLICY.sentinels.some(function (x) { return String(str).indexOf(x) >= 0; }); };
    /* A DECLARED DOMAIN THAT IS NOT A NAME. `publisher.domains: ['ch']` was
     * accepted, and the file then ran on every .ch host there is, the origin's
     * own included: one entry, and the first lock of the whole device was off.
     * What this engine can honestly verify is SHAPE, never ownership: it has no
     * network, and the list of public suffixes is not something a single file
     * can carry and keep true. So it checks the one thing that holds in every
     * registry: a name you own is never a bare suffix. An entry that fails is
     * not a declaration, so it is refused at its own index AND kept out of the
     * host comparison below, where it would otherwise still match.
     * A placeholder is skipped here and listed once, further down, as a
     * placeholder: the same treatment an unfilled review date already gets, so
     * that a starter file is not told the same thing twice in two words. */
    var usable = [];
    domains.forEach(function (d, i) {
      if (hasSentinel(d)) return;
      if (registrableDomain(d)) usable.push(d);
      else bad('publisher.domains[' + i + ']', 'publisherDomains');
    });
    if (!domains.length) bad('publisher.domains', 'publisherDomains');
    else if (!local && !usable.some(function (d) { return endsWithDomain(hostname, d); })) {
      bad('publisher.domains', 'hostNotDeclared', { host: hostname });
    }

    var review = isObject(tree.review) ? tree.review : {};
    if (!solid(review.by)) bad('review.by', 'reviewBy');
    if (!review.date) bad('review.date', 'reviewDate');
    /* A date still holding a placeholder is listed once, below, as a placeholder. */
    else if (!isValidDate(review.date) && !hasSentinel(review.date)) bad('review.date', 'badReviewDate');

    if (!solid(tree.disclaimer) && !isObject(tree.disclaimer)) bad('disclaimer', 'disclaimerMissing');
    else arr(tree.langs).forEach(function (l) {
      if (isObject(tree.disclaimer) && !solid(tree.disclaimer[l])) bad('disclaimer.' + l, 'disclaimerMissing');
    });

    /* AT HOME means the institution is speaking on its own site: the page is
     * served from the origin's domain (or from a NAMED local host), and the tree
     * declares NOTHING BUT domains of that institution. Both halves are needed.
     * Without the first, a verbatim copy elsewhere would exempt itself by
     * declaring unil.ch; without the second, a copy that kept one foreign domain
     * in its list would pass while serving from inside.
     *
     * WHAT CHANGED, and why. The exemption used to demand a third thing: the
     * tree's id had to be one of POLICY.homeIds, exactly. That refused a faculty
     * of the origin institution publishing its own variant on hec.unil.ch, under
     * the id hec-ia, on its own domain, in its own name, with links to itself:
     * every one of those was reported as a copy of the origin. It is not a copy,
     * it IS the origin, and an institution locked out of its own domain is a
     * lock nobody will keep. homeIds still reserves the identifier FAMILY, which
     * is what it is for, and it reserves it everywhere the page is not at home.
     */
    var atHome = (named || endsWithDomain(hostname, POLICY.homeDomain)) &&
                 domains.length > 0 &&
                 domains.every(function (d) { return endsWithDomain(String(d), POLICY.homeDomain); });
    /* Which prefix, not merely that one matched: every refusal below names the
     * string it actually found, because a refusal that names something else
     * sends the person fixing the file looking for words that are not in it. */
    var idPrefix = null;
    POLICY.homeIds.forEach(function (id) {
      if (idPrefix === null && String(tree.id || '').indexOf(id) === 0) idPrefix = id;
    });
    if (!atHome && idPrefix !== null) bad('id', 'reservedId', { term: idPrefix, origin: POLICY.homeName });

    /* Placeholders: EVERYWHERE, signature included, since that is where a
     * starter file puts them. Reserved terms: content only, because the name of
     * the origin institution may legitimately appear in a signature. */
    /* LU COMME LE LECTEUR LE LIT, ET PAS AUTREMENT. Ce balayage comparait la
     * chaine brute pendant que celui des noms reserves, juste en dessous,
     * passait par plain(). Trois ecritures d'un meme marqueur traversaient donc
     * un verdict « publiable » en etant dessinees telles quelles par Chrome :
     * TO_**FILL**_IN, dont le gras n'est pas du texte ; TO_<ZWSP>FILL_IN, dont
     * l'espace de largeur nulle ne se voit pas ; et le marqueur en pleine
     * chasse, que NFKD ramene aux memes lettres. plain() defait les trois d'un
     * coup, puisque c'est exactement son travail. La chaine brute reste
     * examinee : ce qui est ajoute ne retire rien. */
    walkStrings(tree, '', function (str, path) {
      var forms = [str].concat(plain(str));
      POLICY.sentinels.forEach(function (s) {
        for (var i = 0; i < forms.length; i++) {
          if (forms[i].indexOf(s) >= 0) { bad(path, 'placeholder', { sentinel: s }); return; }
        }
      });
    });
    /* A link to a domain the standards keep for documentation leads nowhere, so
     * OFFERING one to a reader is a placeholder wherever it stands, the origin's
     * own site included. Read off the HOST of a parsed URL: as a substring,
     * "example.org" also refused a link to counterexample.org, which is
     * somebody's real domain.
     * OFFERING, and no longer merely holding. RFC 2606 reserves example.org for
     * examples and documentation, and an institution that keeps one in `links`
     * to show what an entry looks like was refused for writing exactly what the
     * standard reserves that name for. A link no result names is drawn on no
     * screen: renderLink() is reached through a result's `allowed` and through
     * nothing else, so such an entry cannot reach a reader and is left alone.
     * The moment a result offers it, it is a dead link in front of somebody, and
     * it is refused again. */
    var offered = Object.create(null);
    Object.keys(isObject(tree.results) ? tree.results : {}).forEach(function (rid) {
      var r = tree.results[rid];
      arr(isObject(r) ? r.allowed : null).forEach(function (lid) { offered[String(lid)] = true; });
    });
    Object.keys(links).forEach(function (id) {
      if (offered[id] !== true) return;
      var host = hostOf(isObject(links[id]) ? links[id].href : null), doc = null;
      if (!host) return;
      POLICY.docDomains.forEach(function (d) { if (doc === null && endsWithDomain(host, d)) doc = d; });
      if (doc !== null) bad('links.' + id + '.href', 'placeholder', { sentinel: doc });
    });
    /* The example questionnaire, published unchanged under somebody's signature.
     * Recognised by what it IS, not by a sentence it happens to contain. */
    if (POLICY.example && examplePrint(tree) === POLICY.example) {
      bad('nodes', 'placeholderExample');
    }
    if (!atHome) {
      /* Everything the reader sees, not only the questions: the page title and
       * the disclaimer name the origin just as loudly, and so do the publisher
       * and reviewer printed under every result. Exempting those two let a copy
       * go live signed by the origin, which is the one thing this lock exists to
       * prevent.
       *
       * `derivedFrom` IS EXEMPT WHERE NAMING THE SOURCE IS ITS JOB, AND NOWHERE
       * ELSE. That is `derivedFrom` itself when it is a bare name, and its
       * `name`, `url` and `licence`. It used to be the whole object, `note`
       * included -- and `note` is free prose that prints under every result, so
       * a copy wrote "reviewed and certified by the University of Lausanne"
       * there and contradicted, word for word, the sentence the engine had just
       * drawn above it saying the source had NOT reviewed it.
       *
       * Scanning `note` would have broken the licence if the engine had left the
       * attribution to it: a CC BY notice names the creator, the work, the
       * licence and the modification, and every one of those names the origin.
       * So the ENGINE writes that notice, out of `name`, `url` and `licence`,
       * which are three exempt fields holding no prose. The adopter owes the
       * licence nothing further, and `note` is what they wish to add on top --
       * scanned like the rest of the page, because the sentence that discharges
       * the licence has already been drawn above it, by us, in full.
       */
      var scripts = treeScripts(tree);
      var NAMES_SOURCE = { 'derivedFrom': 1, 'derivedFrom.name': 1,
                           'derivedFrom.url': 1, 'derivedFrom.licence': 1 };
      Object.keys(tree).forEach(function (top) {
        walkStrings(tree[top], top, function (str, path) {
          if (NAMES_SOURCE[path] === 1) return;
          /* publisher.domains holds hostnames, not prose. A neighbour of the
           * origin (hec.unil.ch) names it by construction, and refusing that
           * would lock the origin's own institution out of its own domain.
           * Compared EXACTLY, never as a prefix: "publisher.domainsNote" is not
           * publisher.domains, and it used to buy the same exemption while
           * holding whatever prose its author cared to write there. */
          if (path === 'publisher.domains' || path.indexOf('publisher.domains[') === 0) return;
          /* The words FOUND, not the policy's name for itself. Three texts with
           * nothing in common, one of them saying only "DCSR", all produced one
           * sentence about the University of Lausanne. */
          originHits(str, scripts).forEach(function (term) {
            /* A RUN THIS FILE CANNOT READ IS NOT THE SAME REFUSAL AS A NAME IT
             * CAN. Four letters of an undeclared script look like four letters
             * of any name, and a French questionnaire quoting the Japanese term
             * for personal data was told to rewrite it in its own words, which
             * is no advice at all. When the reading held not one letter this
             * file could read, the refusal says so, and says what lifts it. */
            var key = /[A-Za-z]/.test(term) ? 'reservedTerm' : 'reservedShape';
            bad(path, key, { term: term, origin: POLICY.homeName });
          });
        });
      });
      Object.keys(links).forEach(function (id) {
        var href = isObject(links[id]) ? links[id].href : null;
        if (!href) return;
        var hit = linkOrigin(href);
        if (hit !== null) bad('links.' + id + '.href', 'reservedLink', { term: hit, origin: POLICY.homeName });
      });
    }
  }
  /* Which reserved host or prefix this link points at, or null.
   * A PREFIX IS A HOST AND A PATH, and each is compared as what it is. Against
   * the raw string, "https://www.padlet.com/ai_research/board" walked past a
   * rule that refused "https://padlet.com/ai_research/board", and so did a
   * trailing dot on the host, an explicit ":443", and "/%61i_research". Four
   * spellings of one address, one of them refused. */
  function linkOrigin(href) {
    var host = hostOf(href), path = pathOf(href), hit = null;
    POLICY.reservedHosts.forEach(function (d) { if (hit === null && endsWithDomain(host, d)) hit = d; });
    POLICY.reservedPrefixes.forEach(function (p) {
      if (hit !== null) return;
      var cut = p.indexOf('/');
      var ph = (cut < 0 ? p : p.slice(0, cut)).toLowerCase();
      var pp = cut < 0 ? '' : p.slice(cut).toLowerCase();
      if (!endsWithDomain(host, ph)) return;
      if (pp && !pathUnder(path, pp)) return;
      hit = p;
